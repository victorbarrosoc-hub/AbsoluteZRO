openapi: 3.1.0
info:
  title: Absolute ZRO HUB API
  version: 0.1.0
  description: |
    API do HUB. Autenticação por cookie de sessão `zro_session` (httpOnly). Mutações exigem Origin do próprio HUB.
    Toda operação passa pela cadeia do PRD §5.2: identidade → organização ativa → papel → projeto → entitlement →
    feature → quota → recurso externo. A organização é sempre a da sessão; nenhum id de organização do cliente vale
    como autorização.
    Erros: `{ "error": "<código>", "message": "<texto>" }` com 401 unauthenticated, 403 forbidden_role |
    entitlement_required | feature_not_included | product_unavailable | product_closed | quota_not_configured | origin_rejected,
    404 project_not_found | not_found, 409 no_active_organization | conflict | sem_conexao, 422 invalid_input, 429 quota_exceeded | rate_limited,
    403 app_desligado (Agenda: o app foi desligado nas Conexões da pessoa), 503 upstream_unavailable.
    Gate de lançamento (ADR 0023): produto fechado ao público só abre para contas listadas em `zro.product_release_access`,
    no canal do pedido (sessão do HUB = web, token de app = api). Fora disso toda rota com produto responde 403
    `product_closed` ("Este app ainda está em desenvolvimento.", `details.closed = true`, `details.upgrade = false`),
    inclusive as rotas do Carro do Freela e a Z chamada de dentro de um app. Token Bearer de cliente de produto fechado
    para conta fora da lista é 401 unauthenticated.
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: zro_session }
    appToken: { type: http, scheme: bearer, bearerFormat: JWT, description: 'Access token do login único (at+jwt) de um app da família, com o escopo da rota.' }
    appClient: { type: http, scheme: basic, description: 'client_id:client_secret de um app confidencial da família (só onde a rota diz).' }
    providerSignature: { type: apiKey, in: header, name: zro-signature, description: 't=<unix>,v1=<hex HMAC-SHA256 de "t.corpo">' }
    cronSecret: { type: http, scheme: bearer, description: 'CRON_SECRET do projeto na Vercel (só o agendamento da própria Vercel manda).' }
  schemas:
    Error:
      type: object
      required: [error, message]
      properties: { error: { type: string }, message: { type: string }, details: { type: object } }
    ProjectCreate: { $ref: './schemas/zro-project-create.v1.schema.json' }
    MediaManifest: { $ref: './schemas/zro-media-manifest.v1.schema.json' }
    OrganizationPlan: { $ref: './schemas/zro-organization-plan.v1.schema.json' }
    CarroJob: { $ref: './schemas/carro-do-freela.job.v1.schema.json' }
    CarroCrew: { $ref: './schemas/carro-do-freela.crew.v1.schema.json' }
    TpeasyBackup: { $ref: './schemas/tpeasy.backup.v1.schema.json' }
    AppEntregaEntrada: { $ref: './schemas/zro.app-entrega.entrada.v1.schema.json' }
    AppEntregaEstado: { $ref: './schemas/zro.app-entrega.estado.v1.schema.json' }
    AppEntregasEnviadas: { $ref: './schemas/zro.app-entrega.enviadas.v1.schema.json' }
    AppEntregaDestinatarios: { $ref: './schemas/zro.app-entrega.destinatarios.v1.schema.json' }
    AppEntregasRecebidas: { $ref: './schemas/zro.app-entrega.recebidas.v1.schema.json' }
    AppEntregaRecebidasEntrada: { $ref: './schemas/zro.app-entrega.recebidas-entrada.v1.schema.json' }
  responses:
    Error: { description: Erro de domínio, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
security: [{ session: [] }]
paths:
  /api/health:
    get: { security: [], summary: Saúde do HUB e do banco, responses: { '200': { description: ok }, '503': { description: banco indisponível } } }
  /api/cron/dolar:
    get:
      {
        security: [{ cronSecret: [] }],
        summary: 'Agendamento diário: dólar PTAX (venda) do Banco Central para os Custos (migração 0030)',
        responses:
          {
            '200': { description: 'cotação gravada (venda, data, fonte bcb-ptax)' },
            '401': { description: sem o CRON_SECRET certo },
            '502': { description: 'Banco Central fora do ar (o último valor continua)' },
            '503': { description: CRON_SECRET não configurado },
          },
      }
  /api/v1/auth/signup:
    post:
      {
        security: [],
        summary: Criar conta (define o cookie de sessão),
        responses: { '201': { description: criada }, default: { $ref: '#/components/responses/Error' } },
      }
  /api/v1/auth/login:
    post: { security: [], summary: Entrar, responses: { '200': { description: sessão criada }, default: { $ref: '#/components/responses/Error' } } }
  /api/v1/auth/logout:
    post: { summary: Sair (revoga a sessão), responses: { '200': { description: ok } } }
  /api/v1/me:
    get: { summary: Pessoa, organização ativa e organizações, responses: { '200': { description: ok }, default: { $ref: '#/components/responses/Error' } } }
  /api/v1/users/{id}/avatar:
    get:
      summary: Foto do perfil (a própria ou de quem está na organização ativa; muda de endereço com ?v=)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: imagem (webp, jpeg ou png) }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/foto/{id}:
    get:
      summary: Foto do perfil para os apps da família (perfil único). Endereço público vindo do claim picture; muda a cada foto nova
      security: []
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: imagem (webp, jpeg ou png), em cache para sempre }, '404': { description: foto trocada ou conta inativa } }
  /api/v1/ia/estado:
    get:
      summary: IA do ecossistema · se está ligada, primeiro nome, plataforma (do token) e créditos do mês (zro.ai_credits)
      security: [{ session: [] }, { appToken: [] }]
      responses:
        { '200': { description: '{ ligada, nome, produto, creditos: { usados, limite, renova_em } }' }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/ia/conversas:
    get:
      summary: Conversas da pessoa com a IA. Com o token de um app (escopo zro.ia), só as daquele app; pelo HUB, todas ou ?produto=<id>|hub
      security: [{ session: [] }, { appToken: [] }]
      parameters: [{ name: produto, in: query, required: false, schema: { type: string } }]
      responses:
        {
          '200': { description: '{ conversas: [{ id, titulo, produto, produtoNome, atualizada, criada }] }' },
          default: { $ref: '#/components/responses/Error' },
        }
  /api/v1/ia/conversas/{id}:
    get:
      summary: Uma conversa com as mensagens (só de quem conversou)
      security: [{ session: [] }, { appToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: '{ conversa, mensagens: [{ id, papel, texto, criada }] }' }, '404': { $ref: '#/components/responses/Error' } }
    delete:
      summary: Apaga a conversa
      security: [{ session: [] }, { appToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: apagada }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/ia/mensagens:
    post:
      summary: Pergunta à IA do ecossistema. Resposta em streaming NDJSON (conversa, lendo, texto, fim | erro). Gasta 1 crédito zro.ai_credits por resposta
      security: [{ session: [] }, { appToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                {
                  conversa: { type: string, format: uuid, description: 'continua uma conversa; sem ele, começa outra' },
                  texto: { type: string, maxLength: 8000 },
                }
      responses:
        '200': { description: 'application/x-ndjson: uma linha JSON por evento' }
        '403': { description: quota_not_configured (plano sem créditos de IA) }
        '429': { description: quota_exceeded (créditos do mês acabaram) }
        '503': { description: upstream_unavailable (IA ainda não ligada) }
        default: { $ref: '#/components/responses/Error' }
  # Laboratório da Z (ADR 0033): só o papel admin da plataforma (403 platform_role_required para qualquer outra
  # pessoa, suporte inclusive). Tudo que custa confere o teto do dia antes (403 quota_not_configured sem teto, 429
  # quota_exceeded passou) e registra o uso com chave de idempotência. Chave ausente: 503 upstream_unavailable com o
  # nome da variável (IA_ANTHROPIC_KEY ou ELEVENLABS_API_KEY).
  /api/v1/admin/correio:
    get:
      summary: Correio do console (ADR 0034). Caixas do papel (admin vê victor@, contato@ e financeiro@; financeiro, só financeiro@) e se o iCloud está configurado
      security: [{ session: [] }]
      responses:
        {
          '200': { description: '{ configurado, faltam, caixas }' },
          '403': { description: platform_role_required },
          default: { $ref: '#/components/responses/Error' },
        }
  /api/v1/admin/correio/{caixa}/mensagens:
    get:
      summary: As 50 mensagens mais novas da caixa, direto do iCloud (IMAP). INBOX separado pelo alias em To, Cc, Delivered-To ou X-Original-To. Nada fica guardado
      security: [{ session: [] }]
      parameters: [{ name: caixa, in: path, required: true, schema: { type: string, enum: [victor, contato, financeiro] } }]
      responses:
        '200': { description: '{ caixa, mensagens: [{ uid, de, assunto, data, lida, tamanho }] }' }
        '403': { description: platform_role_required (caixa fora do papel) }
        '503': { description: upstream_unavailable (Correio não configurado ou iCloud fora) }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/correio/{caixa}/mensagens/{uid}:
    get:
      summary: Abre a mensagem e marca como lida. HTML limpo num documento com CSP própria (iframe sandbox na tela); imagens remotas só com imagens=1. De outra caixa = 404
      security: [{ session: [] }]
      parameters:
        - { name: caixa, in: path, required: true, schema: { type: string, enum: [victor, contato, financeiro] } }
        - { name: uid, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: imagens, in: query, required: false, schema: { type: string, enum: ['1'] } }
      responses:
        '200': { description: '{ mensagem: { uid, de, para, cc, replyTo, assunto, data, documento, imagensBloqueadas, texto, anexos } }' }
        '404': { description: not_found }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/correio/{caixa}/mensagens/{uid}/anexos/{indice}:
    get:
      summary: Baixa um anexo (até 4 MB), sempre como download, com a mesma checagem de papel e de caixa
      security: [{ session: [] }]
      parameters:
        - { name: caixa, in: path, required: true, schema: { type: string, enum: [victor, contato, financeiro] } }
        - { name: uid, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: indice, in: path, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        {
          '200': { description: o arquivo (content-disposition attachment) },
          '404': { description: not_found },
          default: { $ref: '#/components/responses/Error' },
        }
  /api/v1/admin/correio/{caixa}/enviar:
    post:
      summary: Responde (responderA = uid) ou escreve um e-mail novo saindo do alias da caixa, por SMTP do iCloud. Cópia em Sent Messages (IMAP APPEND) e audit_logs sem o corpo
      security: [{ session: [] }]
      parameters: [{ name: caixa, in: path, required: true, schema: { type: string, enum: [victor, contato, financeiro] } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto: { type: string, maxLength: 100000 }
                responderA: { type: integer, minimum: 1, description: uid da mensagem respondida (sem ele, e-mail novo) }
                todos: { type: boolean, description: na resposta, inclui quem estava em To e Cc }
                para: { type: string, description: e-mail novo, até 20 destinatários somando Cc }
                cc: { type: string }
                assunto: { type: string, maxLength: 300 }
      responses:
        '201': { description: '{ ok, messageId, copiaEmEnviadas }' }
        '400': { description: invalid_input }
        '403': { description: platform_role_required }
        '503': { description: upstream_unavailable }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/z-lab:
    get:
      summary: Estado do laboratório (chaves ligadas, rascunho, versões, publicada, conhecimento, recursos, gasto, catálogo)
      security: [{ session: [] }]
      responses: { '200': { description: ok }, '403': { description: platform_role_required }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/admin/z-lab/rascunho:
    put:
      summary: Grava o rascunho da configuração da Z (o corpo é a configuração inteira). Não cria versão nem muda os clientes
      security: [{ session: [] }]
      responses: { '200': { description: ok }, '400': { description: invalid_input }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/admin/z-lab/versoes:
    post:
      summary: Salvar versão (nota obrigatória; com `rascunho`, grava o rascunho antes). Número novo e imutável
      security: [{ session: [] }]
      requestBody:
        {
          content:
            {
              application/json:
                { schema: { type: object, required: [nota], properties: { nota: { type: string, maxLength: 300 }, rascunho: { type: object } } } },
            },
        }
      responses: { '201': { description: criada }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/admin/z-lab/versoes/{numero}:
    get:
      summary: Configuração de uma versão salva (para comparar)
      security: [{ session: [] }]
      parameters: [{ name: numero, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { '200': { description: ok }, '404': { description: not_found }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/admin/z-lab/versoes/{numero}/restaurar:
    post:
      summary: Traz a versão de volta para o rascunho (a versão continua igual)
      security: [{ session: [] }]
      parameters: [{ name: numero, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { '200': { description: ok }, '404': { description: not_found }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/admin/z-lab/versoes/{numero}/publicar:
    post:
      summary: Publicar para os clientes. Só com a trava publicar_config ligada e `confirmar = "publicar"`; auditado
      security: [{ session: [] }]
      parameters: [{ name: numero, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      requestBody:
        { content: { application/json: { schema: { type: object, required: [confirmar], properties: { confirmar: { type: string, enum: [publicar] } } } } } }
      responses:
        { '200': { description: publicada }, '403': { description: action_not_allowed (trava desligada) }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/admin/z-lab/publicacao/padrao:
    post:
      summary: Volta a Z dos clientes para o padrão do código (`confirmar = "padrao"`; auditado)
      security: [{ session: [] }]
      responses: { '200': { description: ok }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/admin/z-lab/teto:
    put:
      summary: Teto de gasto por dia do laboratório, em US$ (null = sem teto = bloqueado). Auditado
      security: [{ session: [] }]
      requestBody:
        {
          content:
            { application/json: { schema: { type: object, required: [teto], properties: { teto: { type: [number, 'null'], minimum: 0, maximum: 9999 } } } } },
        }
      responses: { '200': { description: ok }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/admin/z-lab/conhecimento:
    post:
      summary: Texto de referência novo (FAQ, planos, preços, manual), até 100 mil caracteres. Auditado
      security: [{ session: [] }]
      responses: { '201': { description: criado }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/admin/z-lab/conhecimento/{id}:
    delete:
      summary: Arquiva um texto de referência (sai do rascunho; versões antigas continuam iguais)
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: ok }, '404': { description: not_found }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/admin/z-lab/recursos/{recurso}:
    put:
      summary: Liga ou desliga para os clientes, por plano, voz, ditado, anexos ou publicar_config. Pede `confirmar = true`; auditado
      security: [{ session: [] }]
      parameters: [{ name: recurso, in: path, required: true, schema: { type: string, enum: [voz, ditado, anexos, publicar_config] } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ligado, planos, confirmar]
              properties: { ligado: { type: boolean }, planos: { type: array, items: { type: string } }, confirmar: { type: boolean, enum: [true] } }
      responses: { '200': { description: ok }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/admin/z-lab/vozes:
    get:
      summary: Vozes da conta da ElevenLabs, marcadas feminina e pt-BR para o filtro
      security: [{ session: [] }]
      responses:
        { '200': { description: ok }, '503': { description: upstream_unavailable (ELEVENLABS_API_KEY) }, default: { $ref: '#/components/responses/Error' } }
    post:
      summary: Salva na conta da ElevenLabs a amostra do Voice Design escolhida (`confirmar = true`; auditado)
      security: [{ session: [] }]
      responses: { '201': { description: voz criada }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/admin/z-lab/vozes/design:
    post:
      summary: Voice Design. Três amostras de uma voz nova pela descrição (nada é salvo na conta). Custo estimado no teto
      security: [{ session: [] }]
      responses: { '200': { description: amostras em base64 }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/admin/z-lab/aprendizados:
    post:
      summary: Guardar um aprendizado (cartão "Aprender" do Testar). Só com `confirmar = true`; entra no rascunho, nunca numa versão. Repetido não duplica; contradição fica no lugar do antigo; a trava recusa regra, permissão, ação ou dado (403 action_not_allowed). Auditado
      security: [{ session: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [proposta, confirmar]
              properties:
                proposta:
                  type: object
                  required: [id, tipo, texto, plataforma, exemplo, gatilho]
                  properties:
                    id: { type: string, format: uuid }
                    tipo: { type: string, enum: [tom, regra, fato, pronuncia, plataforma] }
                    texto: { type: string, minLength: 3, maxLength: 240 }
                    plataforma: { type: [string, 'null'] }
                    exemplo: { type: [string, 'null'], maxLength: 240 }
                    gatilho: { type: string, maxLength: 300 }
                    voz: { type: boolean }
                confirmar: { type: boolean, enum: [true] }
                texto: { type: string, description: texto ajustado no cartão }
                pela: { type: string, enum: [toque, voz, conversa] }
      responses:
        {
          '201': { description: 'aprendizado, repetido, substituido' },
          '403': { description: platform_role_required | action_not_allowed },
          '409': { description: conflict (mais de 40 aprendizados ou de 8 mil caracteres) },
          '422': { description: invalid_input },
          default: { $ref: '#/components/responses/Error' },
        }
  /api/v1/admin/z-lab/aprendizados/{id}:
    patch:
      summary: Edita ou move um aprendizado do rascunho (texto, tipo = seção, plataforma, exemplo). Auditado com o antes e o depois; devolve os conflitos da lista
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        {
          '200': { description: ok },
          '404': { description: not_found },
          '409': { description: conflict (igual a outro) },
          default: { $ref: '#/components/responses/Error' },
        }
    delete:
      summary: Tira um aprendizado do rascunho (as versões salvas continuam iguais). Auditado
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: ok }, '404': { description: not_found }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/admin/z-lab/mensagens:
    post:
      summary: Um turno do laboratório (rascunho, versão N ou padrão; modelo; plataforma; anexos; voz). Streaming NDJSON (lendo, texto, aprendizado, fim com uso e custo | erro). Com `aprender` e `pendentes` (só no rascunho) a Z propõe aprendizados e um "pode guardar" com cartão esperando guarda antes do modelo
      security: [{ session: [] }]
      responses:
        {
          '200': { description: 'application/x-ndjson' },
          '403': { description: quota_not_configured },
          '429': { description: quota_exceeded },
          '503': { description: upstream_unavailable },
          default: { $ref: '#/components/responses/Error' },
        }
  /api/v1/admin/z-lab/fala:
    post:
      summary: Uma frase em voz (ElevenLabs em streaming), PCM 16 bits mono a 24 kHz. Custo pelos caracteres
      security: [{ session: [] }]
      responses: { '200': { description: audio/pcm }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/admin/z-lab/transcricao:
    post:
      summary: Transcreve um pedaço de PCM 16 bits 16 kHz mono (até ~2 min) pelo Scribe v2. `?chave=` (idempotência), `?idioma=pt`
      security: [{ session: [] }]
      responses: { '200': { description: ok }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/admin/z-lab/escuta:
    post:
      summary: Abre a escuta ao vivo (Scribe v2 Realtime). Devolve um token de uso único (15 min, uma conexão); a chave nunca sai do servidor. Se a ElevenLabs recusar o token, devolve `aoVivo` falso e o navegador usa a transcrição por frase
      security: [{ session: [] }]
      responses: { '200': { description: ok }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/admin/z-lab/escuta/fim:
    post:
      summary: Fecha a escuta com os segundos contados (nunca mais que o tempo real desde a abertura)
      security: [{ session: [] }]
      responses: { '200': { description: ok }, '404': { description: not_found }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/admin/z-lab/anexos:
    post:
      summary: Anexo (multipart `arquivo`, até 4 MB). Tipo pelo conteúdo. Imagem e PDF vão para os arquivos da Anthropic (24 h); Word, Excel, PowerPoint e texto voltam como texto
      security: [{ session: [] }]
      responses: { '200': { description: ok }, '400': { description: invalid_input }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/admin/z-lab/anexos/{id}:
    delete:
      summary: Tira um anexo dos arquivos da Anthropic antes das 24 h
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: ok }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/organizations:
    get: { summary: Minhas organizações, responses: { '200': { description: ok } } }
    post: { summary: Criar organização (a pessoa vira dona), responses: { '201': { description: criada }, default: { $ref: '#/components/responses/Error' } } }
  /api/v1/organizations/active:
    post:
      {
        summary: Trocar organização ativa (vínculo conferido no servidor),
        responses: { '200': { description: ok }, default: { $ref: '#/components/responses/Error' } },
      }
  /api/v1/projects:
    get: { summary: Projetos da organização ativa, responses: { '200': { description: ok } } }
    post:
      summary: Criar projeto
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ProjectCreate' } } } }
      responses: { '201': { description: criado }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/projects/{id}:
    get:
      summary: Projeto com etapas, documentos, manifests, execuções e eventos
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: ok }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/projects/{id}/sobedesce/manifests:
    post:
      summary: Importar descarga do SOBEDESCE (entitlement sobedesce:manifest_import, quota sobedesce.manifest_imports)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [descargas, destinations]
              properties:
                descargas: { type: string, description: conteúdo do .sobedesce/descargas.jsonl }
                descarga_id: { type: string }
                destinations:
                  type: array
                  items:
                    type: object
                    required: [id, label, reports]
                    properties:
                      id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
                      label: { type: string }
                      reports: { type: array, items: { type: object, properties: { name: { type: string }, text: { type: string } } } }
      responses: { '201': { description: importado }, '200': { description: já importado (idempotente) }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/projects/{id}/sobedesce/deliveries:
    post:
      summary: Registrar entrega conferida pelo SOBEDESCE e publicar delivery.ready v2 (entitlement sobedesce:manifest_import, quota sobedesce.manifest_imports)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [entrega]
              properties:
                entrega: { type: string, description: 'conteúdo do comprovante sobedesce.entrega/1 (JSON com a pasta do Drive e o MD5 de cada arquivo)' }
      responses: { '201': { description: registrada }, '200': { description: já registrada (idempotente) }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/projects/{id}/synquei/organization-plan:
    post:
      summary: Prévia de organização do Synquei (dry-run, nada é movido)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { manifest_row_id: { type: string, format: uuid } } } } } }
      responses:
        '200':
          {
            description: prévia,
            content: { application/json: { schema: { type: object, properties: { plan: { $ref: '#/components/schemas/OrganizationPlan' } } } } },
          }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}/tpeasy/script:
    get:
      summary: Baixar o roteiro no formato de backup do TPeasy
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        {
          '200': { description: backup, content: { application/json: { schema: { $ref: '#/components/schemas/TpeasyBackup' } } } },
          '403': { $ref: '#/components/responses/Error' },
        }
    post:
      summary: Importar roteiro de um backup do TPeasy como nova versão
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '201': { description: nova versão }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/carro-do-freela/jobs:
    post:
      security: [{ session: [] }, { appToken: [carro-do-freela.jobs] }]
      summary: Criar (ou devolver) o projeto de um job — contrato carro-do-freela.job/1
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CarroJob' } } } }
      responses:
        {
          '201': { description: criado },
          '200': { description: já existia },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
        }
  /api/v1/carro-do-freela/jobs/crew:
    post:
      security: [{ session: [] }, { appToken: [carro-do-freela.jobs] }]
      summary: Equipe escalada vira equipe do projeto do job (carro-do-freela.crew/1); quem é de fora recebe convite de convidado por e-mail
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CarroCrew' } } } }
      responses:
        {
          '200': { description: 'projectId, members[{zro_user_id, function, status: na_equipe | convidado | convite_pendente}], emailDelivery' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
        }
  /api/v1/apps/pedidos:
    post:
      security: [{ appToken: [maestro.projects] }, { appClient: [] }]
      summary: Ponte entre apps (Maestro → SOBEDESCE). Devolve um pedido assinado zro-pedido+jwt (60 s, jti de uso único) para o próprio app chamar o destino; o HUB só assina e audita (app.pedido.emitido). Ações em docs/integration-contracts/maestro-sobedesce.md
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [destino, acao]
              properties:
                destino: { type: string, enum: [sobedesce] }
                acao:
                  {
                    type: string,
                    enum:
                      [
                        drive.listar,
                        drive.miniatura,
                        drive.pasta.criar,
                        drive.compartilhar_revisao,
                        drive.recolher_revisao,
                        drive.token,
                        relay.converter,
                        relay.pedido,
                        relay.cancelar,
                      ],
                    description: 'relay.* (docs/integration-contracts/relay.md) exigem também o Relay no plano',
                  }
                sub: { type: string, format: uuid, description: 'Só com a credencial do app (Basic) e só para drive.recolher_revisao' }
      responses:
        {
          '201': { description: '{ tipo: zro-pedido+jwt, token, aud, acao, expira_em, url }' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
  /api/v1/apps/entregas:
    get:
      security: [{ appToken: [maestro.projects] }]
      summary: 'Entregas entre apps (Criação F8): o que a pessoa mandou de um roteiro ao TPeasy (as 10 mais novas), para o "Enviado · v3 · Recebido". Contrato em docs/integration-contracts/maestro-tpeasy.md'
      parameters:
        - { name: roteiro, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        {
          '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AppEntregasEnviadas' } } } },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
        }
    post:
      security: [{ appToken: [maestro.projects] }]
      summary: 'Manda uma versão salva do roteiro do Maestro para a caixa de entrada do TPeasy da pessoa (ou de alguém da organização que usa o TPeasy). Exige o TPeasy no plano e papel de quem edita. A mesma versão de novo não duplica (situacao reenviada); evento script.version.sent com idempotency_key app.entrega:<id>'
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/AppEntregaEntrada' } } }
      responses:
        {
          '201': { description: 'Nova', content: { application/json: { schema: { $ref: '#/components/schemas/AppEntregaEstado' } } } },
          '200': { description: 'Reenviada (a mesma entrega)', content: { application/json: { schema: { $ref: '#/components/schemas/AppEntregaEstado' } } } },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
  /api/v1/apps/entregas/destinatarios:
    get:
      security: [{ appToken: [maestro.projects] }]
      summary: 'Para quem dá para mandar: a própria pessoa e quem da organização ativa já usa o TPeasy (nome e foto; nunca e-mail). Exige o TPeasy no plano'
      parameters:
        - { name: destino, in: query, required: true, schema: { type: string, enum: [tpeasy] } }
      responses:
        {
          '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AppEntregaDestinatarios' } } } },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
        }
  /api/v1/apps/entregas/recebidas:
    get:
      security: [{ appToken: [tpeasy.roteiros] }]
      summary: 'A caixa de entrada do TPeasy: o que chegou para a pessoa nos últimos 30 dias (desde, se vier), mais antigo primeiro, até 50. Só o próprio TPeasy, com o token da pessoa; agora é o próximo desde'
      parameters:
        - { name: destino, in: query, required: false, schema: { type: string, enum: [tpeasy] } }
        - { name: desde, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        {
          '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AppEntregasRecebidas' } } } },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
        }
    post:
      security: [{ appToken: [tpeasy.roteiros] }]
      summary: 'O aparelho conta o que gravou: quem mandou vê "Recebido"'
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/AppEntregaRecebidasEntrada' } } }
      responses:
        {
          '200': { description: '{ marcadas }' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
        }
  /api/v1/agenda/conexao:
    get:
      security: [{ appToken: [zro.agenda] }]
      summary: 'Conexões (ADR 0026): como está o Google Agenda da pessoa para este app. Contrato em docs/integration-contracts/agenda.md'
      responses:
        {
          '200': { description: '{ conectada, estado: ativa | reconectar | null, conta_email, app_ligado, calendarios, conectar }' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '503': { $ref: '#/components/responses/Error' },
        }
  /api/v1/agenda/livre-ocupado:
    get:
      security: [{ appToken: [zro.agenda] }]
      summary: Intervalos ocupados nas agendas escolhidas pela pessoa (até 62 dias), sem os eventos do próprio app a menos que incluir_proprios=1
      parameters:
        - { name: de, in: query, required: true, schema: { type: string, format: date-time }, description: 'RFC 3339 com fuso' }
        - { name: ate, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: incluir_proprios, in: query, required: false, schema: { type: string, enum: ['1'] } }
      responses:
        {
          '200': { description: '{ de, ate, ocupado: [{ inicio, fim }], calendarios, incompleta }' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '409':
            {
              description: 'sem_conexao (details.motivo nenhuma | reconectar, details.conectar)',
              content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
            },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
          '503': { $ref: '#/components/responses/Error' },
        }
  /api/v1/sons/buscar:
    get:
      security: [{ appToken: [zro.sons] }, { session: [] }]
      summary: Efeitos sonoros livres para uso comercial (Openverse, só CC0, CC BY e domínio público; Freesound e Wikimedia), com autor e licença para os créditos
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 80 } }
        - { name: pagina, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10 } }
      responses:
        {
          '200': { description: '{ sons: [{ id, origem, titulo, autor, licenca, licencaUrl, pagina, fonte, duracao, formato, bytes }], pagina, paginas }' },
          '401': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
          '503': { $ref: '#/components/responses/Error' },
        }
  /api/v1/sons/openverse/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 'Id do som no Openverse' }
    get:
      security: [{ appToken: [zro.sons] }, { session: [] }]
      summary: O arquivo do som (stream), só de fontes conhecidas por https e até 25 MB; título, autor e licença nos cabeçalhos X-Zro-Som-*
      responses:
        {
          '200': { description: 'Áudio (audio/*)' },
          '401': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
          '503': { $ref: '#/components/responses/Error' },
        }
  /api/v1/sons/banco:
    get:
      security: [{ appToken: [zro.sons] }, { session: [] }]
      summary: Uma página da pasta do Drive com os sons da própria pessoa (pelo SOBEDESCE, só leitura); subpastas e só áudios, com busca por nome dentro da pasta
      parameters:
        - { name: pasta, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{10,200}$' }, description: 'Id da pasta no Drive' }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 80 } }
        - { name: pagina, in: query, required: false, schema: { type: string, maxLength: 2000 }, description: 'O `proxima` da página anterior' }
        - { name: conta, in: query, required: false, schema: { type: string, maxLength: 64 }, description: 'A conta Google no SOBEDESCE' }
      responses:
        {
          '200':
            {
              description: '{ pasta: { id, nome }, conta, pastas: [{ id, nome }], sons: [{ id, origem: banco, titulo, nome, formato, bytes, conta }], proxima }',
            },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
          '503': { $ref: '#/components/responses/Error' },
        }
  /api/v1/sons/banco/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{10,200}$' }, description: 'Id do arquivo no Drive' }
      - { name: conta, in: query, required: false, schema: { type: string, maxLength: 64 } }
    get:
      security: [{ appToken: [zro.sons] }, { session: [] }]
      summary: O arquivo de um som do banco da pessoa (stream), conferido como áudio e até 25 MB; o token do Drive nunca sai do HUB
      responses:
        {
          '200': { description: 'Áudio (audio/*), com X-Zro-Som-Id e X-Zro-Som-Titulo' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
          '503': { $ref: '#/components/responses/Error' },
        }
  /api/v1/agenda/eventos:
    get:
      security: [{ appToken: [zro.agenda] }]
      summary: Eventos das agendas escolhidas, com campos mínimos (até 62 dias, 500 no máximo)
      parameters:
        - { name: de, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: ate, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        {
          '200': { description: '{ de, ate, eventos: [{ id, calendario, titulo, inicio, fim, dia_inteiro, ocupa, app, ref }], incompleta }' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
  /api/v1/agenda/eventos/{app}/{ref}:
    parameters:
      - { name: app, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]{1,40}$' }, description: 'O app do token (product_id do cliente)' }
      - { name: ref, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,120}$' }, description: 'Id do item no app' }
    put:
      security: [{ appToken: [zro.agenda] }]
      summary: Grava o evento do app na agenda principal da pessoa, idempotente por (app, ref). Um app só mexe no que é dele (extendedProperties.private zro_app/zro_ref)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [titulo]
              properties:
                titulo: { type: string, maxLength: 200 }
                inicio: { type: string, format: date-time }
                fim: { type: string, format: date-time }
                dia: { type: string, format: date }
                ate_dia: { type: string, format: date, description: inclusivo }
                local: { type: string, maxLength: 300 }
                descricao: { type: string, maxLength: 4000 }
                fuso: { type: string, default: America/Sao_Paulo }
                ocupa: { type: boolean, default: true }
                link: { type: string, format: uri, description: https }
      responses:
        {
          '201': { description: '{ id, criado: true, link }' },
          '200': { description: '{ id, criado: false, link }' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
          '503': { $ref: '#/components/responses/Error' },
        }
    delete:
      security: [{ appToken: [zro.agenda] }]
      summary: Apaga o evento do app (204 mesmo se já não existia)
      responses:
        {
          '204': { description: apagado },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
  /api/v1/pessoas:
    get:
      security: [{ appToken: [zro.pessoas] }]
      summary: 'A comunidade (migração 0038): perfis visíveis com o @ confirmado (a sugestão automática não entra), por ordem de @, até 200 por página. Sem e-mail nem telefone. Contrato em docs/integration-contracts/pessoas.md'
      parameters:
        - { name: funcao, in: query, required: false, schema: { type: string }, description: 'chave de função do perfil (camera, edicao, …)' }
        - { name: depois, in: query, required: false, schema: { type: string, maxLength: 30 }, description: 'o `proximo` da página anterior' }
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        {
          '200':
            {
              description: '{ pessoas: [{ id (sub), arroba, nome, foto, funcoes: [{ chave, nome }], cidade, portfolio, bio, selos: [{ produto, texto }], perfil }], proximo: string | null }',
            },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
  /api/v1/pessoas/busca:
    get:
      security: [{ appToken: [zro.pessoas] }]
      summary: 'Perfil profissional (ADR 0029): busca por @ (q começa com @) ou nome. Só perfis visíveis, sem a própria pessoa, sem e-mail nem telefone. Contrato em docs/integration-contracts/pessoas.md'
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 60 }, description: '@começo-do-arroba ou parte do nome (2+ caracteres)' }
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 20, default: 12 } }
      responses:
        {
          '200':
            {
              description: '{ pessoas: [{ id (sub), arroba, nome, foto, funcoes: [{ chave, nome }], cidade, portfolio, bio, selos: [{ produto, texto }], perfil }] }',
            },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
  /api/v1/pessoas/convites:
    post:
      security: [{ appToken: [zro.pessoas] }]
      summary: Convida o @ para a organização do token (dono ou administração). A pessoa aceita na Absolute ZRO; o e-mail dela nunca volta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arroba]
              properties:
                arroba: { type: string, description: 'com ou sem @' }
                papel: { type: string, enum: [admin, manager, editor, viewer, billing], default: editor }
      responses:
        {
          '201': { description: '{ convite: { id, arroba, papel, aviso: email | central } }' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
  /api/v1/pessoas/{arroba}:
    get:
      security: [{ appToken: [zro.pessoas] }]
      summary: 'O perfil visível de um @ (o caminho leva o @: /api/v1/pessoas/@fulano). @ antigo dos últimos 90 dias leva ao atual com antiga: true. Escondido ou inexistente: 404'
      parameters:
        - { name: arroba, in: path, required: true, schema: { type: string, pattern: '^@[a-z0-9._]{3,30}$' } }
      responses:
        {
          '200': { description: '{ pessoa: { id, arroba, nome, foto, funcoes, cidade, portfolio, bio, selos, perfil }, antiga }' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
  /api/v1/set:
    get:
      security: [{ session: [] }, { appToken: [zro.set] }]
      summary: 'Set (ADR 0031): a pessoa e as preferências, quem da equipe e dos contatos está online (e em qual app; só para quem a pessoa deixou ver), não lidas e pedidos. Nunca e-mail nem telefone. Contrato em docs/integration-contracts/set.md'
      parameters:
        - { name: If-None-Match, in: header, required: false, description: 'a ETag da última leitura (o poll do widget)', schema: { type: string } }
      responses:
        {
          '200':
            {
              description: '{ eu: { id, arroba, nome, foto, preferencias: { invisivel, quemVe, mostrarVisto } }, pessoas: [{ id, arroba, nome, foto, equipe, contato, estado: online | ausente | offline, app: { id, nome } | null, vistoEm }], naoLidas, pedidos, porConversa: { <conversa>: n }, ultima }',
            },
          '304': { description: 'nada mudou desde a ETag mandada (sem corpo; mesma ETag no cabeçalho)' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
    post:
      security: [{ session: [] }, { appToken: [zro.set] }]
      summary: 'Batida de presença do app (o app vem do token; pela central, hub). Invisível não grava nada. Devolve o mesmo estado do GET'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado: { type: string, enum: [ativo, ausente, saiu], default: ativo }
      responses:
        {
          '200': { description: 'o estado (como no GET)' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
  /api/v1/set/preferencias:
    put:
      security: [{ session: [] }, { appToken: [zro.set] }]
      summary: 'Invisível, quem vê a presença e o "visto há". Ficar invisível (ou ninguém) apaga a presença na hora'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invisivel: { type: boolean }
                quemVe: { type: string, enum: [equipe_contatos, equipe, contatos, ninguem] }
                mostrarVisto: { type: boolean }
      responses:
        {
          '200': { description: '{ preferencias: { invisivel, quemVe, mostrarVisto } }' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
  /api/v1/set/contatos:
    get:
      security: [{ session: [] }, { appToken: [zro.set] }]
      summary: Contatos, pedidos recebidos e enviados e bloqueados (nome, @ e foto)
      responses:
        {
          '200': { description: '{ contatos: [pessoa], recebidos: [pessoa], enviados: [pessoa], bloqueados: [pessoa] }' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
    post:
      security: [{ session: [] }, { appToken: [zro.set] }]
      summary: 'Pede contato pelo @ (perfil visível) ou pelo id de alguém do Set. Pedido mútuo vira contato na hora; já contatos, 409. 20 por dia. Com { ver }, só a prévia do @'
      description: >-
        { ver: "@fulano" } não pede nada: devolve 200 com quem é o perfil visível do @ e a situação com a pessoa
        (nenhuma, contato, enviado, recebido, bloqueado; o bloqueio que a outra fez nunca aparece). Escondido ou
        inexistente: o mesmo 404. Mesmo limite da busca de perfis (60 a cada 10 minutos). Repetir um pedido já enviado e
        aceitar o recebido não gastam os 20 do dia.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                arroba: { type: string, description: 'com ou sem @' }
                pessoa: { type: string, format: uuid }
                ver: { type: string, description: 'só a prévia do @ (com ou sem @); nada é pedido' }
                buscar: { type: string, description: 'sugestões enquanto digita (3+ letras): começo do @ ou nome; até 5, sem bloqueados nos dois sentidos' }
      responses:
        {
          '200':
            {
              description: '{ ver }: { pessoa: { id, arroba, nome, foto }, situacao: nenhuma | contato | enviado | recebido | bloqueado }; { buscar }: { pessoas: [{ pessoa, situacao }] }',
            },
          '201': { description: '{ estado: pendente | aceito, pessoa: { id, arroba, nome, foto } }' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
  /api/v1/set/contatos/{id}:
    put:
      security: [{ session: [] }, { appToken: [zro.set] }]
      summary: Aceita ou recusa o pedido recebido da pessoa {id} (quem pediu não fica sabendo da recusa)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acao]
              properties:
                acao: { type: string, enum: [aceitar, recusar] }
      responses:
        {
          '200': { description: '{ estado: aceito | recusado }' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
    delete:
      security: [{ session: [] }, { appToken: [zro.set] }]
      summary: Tira o contato ou cancela o pedido enviado
      responses:
        {
          '204': { description: feito },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
  /api/v1/set/bloqueios:
    post:
      security: [{ session: [] }, { appToken: [zro.set] }]
      summary: Bloqueia a pessoa (some presença, contato, pedido e mensagens nos dois sentidos; ninguém é avisado)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pessoa]
              properties:
                pessoa: { type: string, format: uuid }
      responses:
        {
          '204': { description: feito },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
  /api/v1/set/bloqueios/{id}:
    delete:
      security: [{ session: [] }, { appToken: [zro.set] }]
      summary: Desbloqueia (o contato não volta sozinho)
      responses:
        {
          '204': { description: feito },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
  /api/v1/set/conversas:
    get:
      security: [{ session: [] }, { appToken: [zro.set] }]
      summary: 'As conversas (diretas e dos projetos da organização ativa) e os projetos ainda sem conversa'
      parameters:
        - { name: If-None-Match, in: header, required: false, description: 'a ETag da última leitura (o poll do widget)', schema: { type: string } }
      responses:
        {
          '200':
            {
              description: '{ conversas: [{ id, tipo: direta | projeto, pessoa, projeto: { id, titulo }, titulo, ultima, ultimaEm, previa, previaMinha, naoLidas, silenciada, podeEscrever }], projetos: [{ id, titulo }] }',
            },
          '304': { description: 'nada mudou desde a ETag mandada (sem corpo; mesma ETag no cabeçalho)' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
    post:
      security: [{ session: [] }, { appToken: [zro.set] }]
      summary: 'Abre (ou cria) a conversa direta com quem trabalha junto ou é contato aceito, ou a do projeto canônico (quem vê o projeto)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pessoa: { type: string, format: uuid }
                projeto: { type: string, format: uuid }
      responses:
        {
          '200': { description: '{ conversa }' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
  /api/v1/set/conversas/{id}:
    get:
      security: [{ session: [] }, { appToken: [zro.set] }]
      summary: A conversa e as mensagens (as 50 mais novas antes de `antes`, ou as que chegaram depois de `depois`), a mais antiga primeiro
      parameters:
        - { name: antes, in: query, required: false, schema: { type: integer } }
        - { name: depois, in: query, required: false, schema: { type: integer } }
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: If-None-Match, in: header, required: false, description: 'a ETag da última leitura (o poll do widget)', schema: { type: string } }
      responses:
        {
          '200': { description: '{ conversa, mensagens: [{ id, seq, autor: { id, arroba, nome, foto }, minha, texto, criadaEm, editadaEm, apagada }], mais }' },
          '304': { description: 'nada mudou desde a ETag mandada (sem corpo; mesma ETag no cabeçalho)' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
    patch:
      security: [{ session: [] }, { appToken: [zro.set] }]
      summary: Marca como lida até a sequência e liga ou desliga o silêncio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lidaAte: { type: integer }
                silenciada: { type: boolean }
      responses:
        {
          '204': { description: feito },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
  /api/v1/set/conversas/{id}/mensagens:
    post:
      security: [{ session: [] }, { appToken: [zro.set] }]
      summary: 'Envia texto (com links), até 4000 caracteres. chave torna o envio idempotente (repetida: 200). 30 por minuto'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto: { type: string, maxLength: 4000 }
                chave: { type: string, pattern: '^[A-Za-z0-9_-]{8,80}$' }
      responses:
        {
          '201': { description: '{ mensagem: { id, seq, criadaEm, repetida } }' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
  /api/v1/set/mensagens/{id}:
    patch:
      security: [{ session: [] }, { appToken: [zro.set] }]
      summary: Edita a própria mensagem nas primeiras 24 horas (a versão anterior fica para a moderação)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto: { type: string, maxLength: 4000 }
      responses:
        {
          '204': { description: feito },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
    delete:
      security: [{ session: [] }, { appToken: [zro.set] }]
      summary: Apaga a própria mensagem (fica "Mensagem apagada")
      responses:
        {
          '204': { description: feito },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
  /api/v1/set/denuncias:
    post:
      security: [{ session: [] }, { appToken: [zro.set] }]
      summary: Denuncia uma pessoa (e, se vier, uma mensagem dela que quem denuncia vê). 10 por dia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pessoa, motivo]
              properties:
                pessoa: { type: string, format: uuid }
                mensagem: { type: string, format: uuid }
                motivo: { type: string, enum: [spam, assedio, ofensa, golpe, outro] }
                detalhe: { type: string, maxLength: 300 }
      responses:
        {
          '201': { description: '{ denuncia: { id } }' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
  /api/v1/desktop/apps:
    get:
      summary: Catálogo da central de apps do computador (ferramentas, versões, arquivos por sistema e SHA-256). Público.
      responses: { '200': { description: ok } }
  /api/v1/entitlements:
    get: { summary: Situação de cada ferramenta para a organização ativa, responses: { '200': { description: ok } } }
  /api/v1/runs:
    get: { summary: Execuções da fila, responses: { '200': { description: ok } } }
  /api/v1/runs/{id}/reprocess:
    post:
      summary: Repetir execução com falha, em revisão ou bloqueada (cria uma nova; repetir de novo devolve a mesma)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '201': { description: nova execução }, '200': { description: já existia }, '409': { $ref: '#/components/responses/Error' } }
  /api/v1/billing/webhooks/{provider}:
    post:
      security: [{ providerSignature: [] }]
      summary: Evento de cobrança assinado (stripe com Stripe-Signature e STRIPE_WEBHOOK_SECRET; outros em ZRO_BILLING_PROVIDERS)
      parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
      responses:
        {
          '200': { description: processed | duplicate | ignored | failed },
          '400': { description: assinatura inválida },
          '404': { description: provedor não habilitado },
        }
  # Login único (OpenID Connect, ADR 0012). Fora de /api: caminhos padrão de provedor OIDC.
  /.well-known/openid-configuration:
    get:
      summary: Descoberta OIDC (issuer, endpoints, ES256, PKCE S256)
      responses: { '200': { description: documento de descoberta } }
  /oauth/authorize:
    get:
      summary: Início do login (código + PKCE S256 obrigatório). Pede login e permissão; volta ao app com code, state e iss
      description: |
        Cliente de produto fechado (ADR 0023) para conta fora da lista: nenhum código. A pessoa vê a página "Em
        desenvolvimento" (200, com "Voltar ao HUB") e fica registrado `release.denied`; com `prompt=none` o app recebe
        `error=access_denied` e `error_description=Este app ainda está em desenvolvimento.`.
      responses: { '307': { description: volta ao redirect_uri cadastrado }, '200': { description: 'tela de permissão, "Em desenvolvimento" ou de erro' } }
  /oauth/token:
    post:
      summary: Troca code (com code_verifier) ou refresh_token por tokens. Apps confidenciais usam client_secret_basic/post
      description: |
        Tokens levam `zro_release` (`{ "<product_id>": "released" | "allowed" | "closed" }`: aberto ao público, fechado
        mas esta conta está na lista, fechado sem acesso) e, com o escopo org, `zro_org` e `zro_products` (só produtos
        contratados e abertos para a pessoa) e `zro_features` (sinais de recurso da organização só do produto do app,
        ex.: `["maestro.marca_propria"]`; lista vazia sem sinal). Produto fechado para a conta: `invalid_grant` com
        `error_description=Este app ainda está em desenvolvimento.`, no code e no refresh.
      requestBody: { content: { application/x-www-form-urlencoded: { schema: { type: object } } } }
      responses:
        {
          '200': { description: access_token (JWT at+jwt, 10 min), id_token, refresh_token rotativo },
          '400': { description: invalid_request | invalid_grant (inclusive produto fechado) | unsupported_grant_type },
          '401': { description: invalid_client },
        }
  /oauth/userinfo:
    get:
      summary: Dados da pessoa (sub, email, name, zro_org, zro_products, zro_features, zro_release) pelo access token Bearer
      responses: { '200': { description: claims }, '401': { description: 'invalid_token (token inválido, app desativado ou produto fechado para a conta)' } }
  /oauth/jwks:
    get:
      summary: Chaves públicas (ES256) para conferir tokens
      responses: { '200': { description: JWKS } }
  /oauth/revoke:
    post:
      summary: Revoga refresh token (RFC 7009); sempre 200
      responses: { '200': { description: ok } }
