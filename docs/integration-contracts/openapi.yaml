openapi: 3.1.0
info:
  title: Absolute ZRO HUB API
  version: 0.1.0
  description: |
    API do HUB. Autenticação por cookie de sessão `zro_session` (httpOnly). Mutações exigem Origin do próprio HUB.
    Toda operação passa pela cadeia do PRD §5.2: identidade → organização ativa → papel → projeto → entitlement →
    feature → quota → recurso externo. A organização é sempre a da sessão; nenhum id de organização do cliente vale
    como autorização.
    Erros: `{ "error": "<código>", "message": "<texto>" }` com 401 unauthenticated, 403 forbidden_role |
    entitlement_required | feature_not_included | product_unavailable | product_closed | quota_not_configured | origin_rejected,
    404 project_not_found | not_found, 409 no_active_organization | conflict, 422 invalid_input, 429 quota_exceeded | rate_limited.
    Gate de lançamento (ADR 0023): produto fechado ao público só abre para contas listadas em `zro.product_release_access`,
    no canal do pedido (sessão do HUB = web, token de app = api). Fora disso toda rota com produto responde 403
    `product_closed` ("Este app ainda está em desenvolvimento.", `details.closed = true`, `details.upgrade = false`),
    inclusive as rotas do Carro do Freela e a Z chamada de dentro de um app. Token Bearer de cliente de produto fechado
    para conta fora da lista é 401 unauthenticated.
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: zro_session }
    appToken: { type: http, scheme: bearer, bearerFormat: JWT, description: 'Access token do login único (at+jwt) de um app da família, com o escopo da rota.' }
    providerSignature: { type: apiKey, in: header, name: zro-signature, description: 't=<unix>,v1=<hex HMAC-SHA256 de "t.corpo">' }
  schemas:
    Error:
      type: object
      required: [error, message]
      properties: { error: { type: string }, message: { type: string }, details: { type: object } }
    ProjectCreate: { $ref: './schemas/zro-project-create.v1.schema.json' }
    MediaManifest: { $ref: './schemas/zro-media-manifest.v1.schema.json' }
    OrganizationPlan: { $ref: './schemas/zro-organization-plan.v1.schema.json' }
    CarroJob: { $ref: './schemas/carro-do-freela.job.v1.schema.json' }
    CarroCrew: { $ref: './schemas/carro-do-freela.crew.v1.schema.json' }
    TpeasyBackup: { $ref: './schemas/tpeasy.backup.v1.schema.json' }
  responses:
    Error: { description: Erro de domínio, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
security: [{ session: [] }]
paths:
  /api/health:
    get: { security: [], summary: Saúde do HUB e do banco, responses: { '200': { description: ok }, '503': { description: banco indisponível } } }
  /api/v1/auth/signup:
    post:
      {
        security: [],
        summary: Criar conta (define o cookie de sessão),
        responses: { '201': { description: criada }, default: { $ref: '#/components/responses/Error' } },
      }
  /api/v1/auth/login:
    post: { security: [], summary: Entrar, responses: { '200': { description: sessão criada }, default: { $ref: '#/components/responses/Error' } } }
  /api/v1/auth/logout:
    post: { summary: Sair (revoga a sessão), responses: { '200': { description: ok } } }
  /api/v1/me:
    get: { summary: Pessoa, organização ativa e organizações, responses: { '200': { description: ok }, default: { $ref: '#/components/responses/Error' } } }
  /api/v1/users/{id}/avatar:
    get:
      summary: Foto do perfil (a própria ou de quem está na organização ativa; muda de endereço com ?v=)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: imagem (webp, jpeg ou png) }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/foto/{id}:
    get:
      summary: Foto do perfil para os apps da família (perfil único). Endereço público vindo do claim picture; muda a cada foto nova
      security: []
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: imagem (webp, jpeg ou png), em cache para sempre }, '404': { description: foto trocada ou conta inativa } }
  /api/v1/ia/estado:
    get:
      summary: IA do ecossistema · se está ligada, primeiro nome, plataforma (do token) e créditos do mês (zro.ai_credits)
      security: [{ session: [] }, { appToken: [] }]
      responses:
        { '200': { description: '{ ligada, nome, produto, creditos: { usados, limite, renova_em } }' }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/ia/conversas:
    get:
      summary: Conversas da pessoa com a IA. Com o token de um app (escopo zro.ia), só as daquele app; pelo HUB, todas ou ?produto=<id>|hub
      security: [{ session: [] }, { appToken: [] }]
      parameters: [{ name: produto, in: query, required: false, schema: { type: string } }]
      responses:
        {
          '200': { description: '{ conversas: [{ id, titulo, produto, produtoNome, atualizada, criada }] }' },
          default: { $ref: '#/components/responses/Error' },
        }
  /api/v1/ia/conversas/{id}:
    get:
      summary: Uma conversa com as mensagens (só de quem conversou)
      security: [{ session: [] }, { appToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: '{ conversa, mensagens: [{ id, papel, texto, criada }] }' }, '404': { $ref: '#/components/responses/Error' } }
    delete:
      summary: Apaga a conversa
      security: [{ session: [] }, { appToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: apagada }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/ia/mensagens:
    post:
      summary: Pergunta à IA do ecossistema. Resposta em streaming NDJSON (conversa, lendo, texto, fim | erro). Gasta 1 crédito zro.ai_credits por resposta
      security: [{ session: [] }, { appToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                {
                  conversa: { type: string, format: uuid, description: 'continua uma conversa; sem ele, começa outra' },
                  texto: { type: string, maxLength: 8000 },
                }
      responses:
        '200': { description: 'application/x-ndjson: uma linha JSON por evento' }
        '403': { description: quota_not_configured (plano sem créditos de IA) }
        '429': { description: quota_exceeded (créditos do mês acabaram) }
        '503': { description: upstream_unavailable (IA ainda não ligada) }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/organizations:
    get: { summary: Minhas organizações, responses: { '200': { description: ok } } }
    post: { summary: Criar organização (a pessoa vira dona), responses: { '201': { description: criada }, default: { $ref: '#/components/responses/Error' } } }
  /api/v1/organizations/active:
    post:
      {
        summary: Trocar organização ativa (vínculo conferido no servidor),
        responses: { '200': { description: ok }, default: { $ref: '#/components/responses/Error' } },
      }
  /api/v1/projects:
    get: { summary: Projetos da organização ativa, responses: { '200': { description: ok } } }
    post:
      summary: Criar projeto
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ProjectCreate' } } } }
      responses: { '201': { description: criado }, default: { $ref: '#/components/responses/Error' } }
  /api/v1/projects/{id}:
    get:
      summary: Projeto com etapas, documentos, manifests, execuções e eventos
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: ok }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/projects/{id}/sobedesce/manifests:
    post:
      summary: Importar descarga do SOBEDESCE (entitlement sobedesce:manifest_import, quota sobedesce.manifest_imports)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [descargas, destinations]
              properties:
                descargas: { type: string, description: conteúdo do .sobedesce/descargas.jsonl }
                descarga_id: { type: string }
                destinations:
                  type: array
                  items:
                    type: object
                    required: [id, label, reports]
                    properties:
                      id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
                      label: { type: string }
                      reports: { type: array, items: { type: object, properties: { name: { type: string }, text: { type: string } } } }
      responses: { '201': { description: importado }, '200': { description: já importado (idempotente) }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/projects/{id}/sobedesce/deliveries:
    post:
      summary: Registrar entrega conferida pelo SOBEDESCE e publicar delivery.ready v2 (entitlement sobedesce:manifest_import, quota sobedesce.manifest_imports)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [entrega]
              properties:
                entrega: { type: string, description: 'conteúdo do comprovante sobedesce.entrega/1 (JSON com a pasta do Drive e o MD5 de cada arquivo)' }
      responses: { '201': { description: registrada }, '200': { description: já registrada (idempotente) }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/projects/{id}/synquei/organization-plan:
    post:
      summary: Prévia de organização do Synquei (dry-run, nada é movido)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { manifest_row_id: { type: string, format: uuid } } } } } }
      responses:
        '200':
          {
            description: prévia,
            content: { application/json: { schema: { type: object, properties: { plan: { $ref: '#/components/schemas/OrganizationPlan' } } } } },
          }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}/tpeasy/script:
    get:
      summary: Baixar o roteiro no formato de backup do TPeasy
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        {
          '200': { description: backup, content: { application/json: { schema: { $ref: '#/components/schemas/TpeasyBackup' } } } },
          '403': { $ref: '#/components/responses/Error' },
        }
    post:
      summary: Importar roteiro de um backup do TPeasy como nova versão
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '201': { description: nova versão }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/carro-do-freela/jobs:
    post:
      security: [{ session: [] }, { appToken: [carro-do-freela.jobs] }]
      summary: Criar (ou devolver) o projeto de um job — contrato carro-do-freela.job/1
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CarroJob' } } } }
      responses:
        {
          '201': { description: criado },
          '200': { description: já existia },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
        }
  /api/v1/carro-do-freela/jobs/crew:
    post:
      security: [{ session: [] }, { appToken: [carro-do-freela.jobs] }]
      summary: Equipe escalada vira equipe do projeto do job (carro-do-freela.crew/1); quem é de fora recebe convite de convidado por e-mail
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CarroCrew' } } } }
      responses:
        {
          '200': { description: 'projectId, members[{zro_user_id, function, status: na_equipe | convidado | convite_pendente}], emailDelivery' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
        }
  /api/v1/desktop/apps:
    get:
      summary: Catálogo da central de apps do computador (ferramentas, versões, arquivos por sistema e SHA-256). Público.
      responses: { '200': { description: ok } }
  /api/v1/entitlements:
    get: { summary: Situação de cada ferramenta para a organização ativa, responses: { '200': { description: ok } } }
  /api/v1/runs:
    get: { summary: Execuções da fila, responses: { '200': { description: ok } } }
  /api/v1/runs/{id}/reprocess:
    post:
      summary: Repetir execução com falha, em revisão ou bloqueada (cria uma nova; repetir de novo devolve a mesma)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '201': { description: nova execução }, '200': { description: já existia }, '409': { $ref: '#/components/responses/Error' } }
  /api/v1/billing/webhooks/{provider}:
    post:
      security: [{ providerSignature: [] }]
      summary: Evento de cobrança assinado (stripe com Stripe-Signature e STRIPE_WEBHOOK_SECRET; outros em ZRO_BILLING_PROVIDERS)
      parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
      responses:
        {
          '200': { description: processed | duplicate | ignored | failed },
          '400': { description: assinatura inválida },
          '404': { description: provedor não habilitado },
        }
  # Login único (OpenID Connect, ADR 0012). Fora de /api: caminhos padrão de provedor OIDC.
  /.well-known/openid-configuration:
    get:
      summary: Descoberta OIDC (issuer, endpoints, ES256, PKCE S256)
      responses: { '200': { description: documento de descoberta } }
  /oauth/authorize:
    get:
      summary: Início do login (código + PKCE S256 obrigatório). Pede login e permissão; volta ao app com code, state e iss
      description: |
        Cliente de produto fechado (ADR 0023) para conta fora da lista: nenhum código. A pessoa vê a página "Em
        desenvolvimento" (200, com "Voltar ao HUB") e fica registrado `release.denied`; com `prompt=none` o app recebe
        `error=access_denied` e `error_description=Este app ainda está em desenvolvimento.`.
      responses: { '307': { description: volta ao redirect_uri cadastrado }, '200': { description: 'tela de permissão, "Em desenvolvimento" ou de erro' } }
  /oauth/token:
    post:
      summary: Troca code (com code_verifier) ou refresh_token por tokens. Apps confidenciais usam client_secret_basic/post
      description: |
        Tokens levam `zro_release` (`{ "<product_id>": "released" | "allowed" | "closed" }`: aberto ao público, fechado
        mas esta conta está na lista, fechado sem acesso) e, com o escopo org, `zro_org` e `zro_products` (só produtos
        contratados e abertos para a pessoa). Produto fechado para a conta: `invalid_grant` com
        `error_description=Este app ainda está em desenvolvimento.`, no code e no refresh.
      requestBody: { content: { application/x-www-form-urlencoded: { schema: { type: object } } } }
      responses:
        {
          '200': { description: access_token (JWT at+jwt, 10 min), id_token, refresh_token rotativo },
          '400': { description: invalid_request | invalid_grant (inclusive produto fechado) | unsupported_grant_type },
          '401': { description: invalid_client },
        }
  /oauth/userinfo:
    get:
      summary: Dados da pessoa (sub, email, name, zro_org, zro_products, zro_release) pelo access token Bearer
      responses: { '200': { description: claims }, '401': { description: 'invalid_token (token inválido, app desativado ou produto fechado para a conta)' } }
  /oauth/jwks:
    get:
      summary: Chaves públicas (ES256) para conferir tokens
      responses: { '200': { description: JWKS } }
  /oauth/revoke:
    post:
      summary: Revoga refresh token (RFC 7009); sempre 200
      responses: { '200': { description: ok } }
