        <p class="apoio">Com a sua conta Absolute ZRO.</p>
        <div class="acoes">
          <a id="entrar" class="vidro vidro--tinta grande" href="/api/zro/entrar">Entrar com Absolute ZRO</a>

        <div class="acoes"><a class="vidro vidro--tinta grande" href="app/">Abrir o AEON</a></div>

      <p id="aviso" class="entrar-aviso" role="status" aria-live="polite"></p>

    <footer class="entrar-rodape"><img src="vendor/marca/absolute-zro-simbolo-branco.svg" alt="" width="16" height="16" /> Uma conta para toda a Absolute ZRO</footer>
