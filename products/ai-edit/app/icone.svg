<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Ícone PROVISÓRIO do editor (o nome e a marca ainda serão decididos pelo titular): três faixas de linha do tempo
       nas cores do produto (--p-ai-edit prata e --p-ai-edit-2 grafite). Não é logo: troque junto com o nome. -->
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2f" />
      <stop offset="1" stop-color="#151518" />
    </linearGradient>
    <linearGradient id="p" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ececf0" />
      <stop offset="1" stop-color="#d4d5db" />
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#f)" />
  <rect x="100.5" y="100.5" width="823" height="823" rx="189.5" fill="none" stroke="#6a6b73" stroke-opacity=".55" />
  <rect x="250" y="330" width="330" height="92" rx="46" fill="url(#p)" />
  <rect x="380" y="466" width="400" height="92" rx="46" fill="url(#p)" />
  <rect x="250" y="602" width="230" height="92" rx="46" fill="url(#p)" />
  <rect x="640" y="300" width="18" height="424" rx="9" fill="#6a6b73" />
</svg>
