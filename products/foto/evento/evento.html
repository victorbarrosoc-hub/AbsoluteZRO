<!doctype html>
<html lang="pt-BR" data-tema="%TEMA%">

       (base, tema, cor) são trocados lá. Sem o nome nem o ícone do produto: assina Absolute ZRO. Sem script inline (CSP). -->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Absolute ZRO</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="%COR_TEMA%" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="data:," />
    <link rel="preload" href="/fontes/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="%BASE%/evento.css" />
    <script type="module" src="%BASE%/evento.js"></script>
  </head>
  <body>
    <main id="evento" aria-busy="true"></main>
    <noscript>Ligue o JavaScript para achar suas fotos.</noscript>
  </body>
</html>
