<!doctype html>
<html lang="pt-BR" data-tema="%TEMA%">
  <!-- A casca do app. Só sai por api/pagina.js, depois do gate (claim zro_release.foto). %NOME%, %ASSINATURA%, %TEMA% e
       %COR_TEMA% são trocados no servidor: o nome mora só em app/nome.js e o tema vem do cookie foto_tema (sem piscar e
       sem script inline, que a CSP não deixa). O sistema visual está em app/foto.css; a casca monta em #app
       (app/principal.js → app/casca/casca.js) e as telas entram em app/telas/<nome>/index.js. -->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%NOME%</title>
    <meta name="description" content="%ASSINATURA%" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="%COR_TEMA%" />
    <meta name="apple-mobile-web-app-title" content="%NOME%" />
    <link rel="icon" href="/app/marca/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/app/marca/icone-180.png" />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="preload" href="/fontes/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/app/foto.css" />
    <link rel="stylesheet" href="/app/casca/casca.css" />
    <link rel="stylesheet" href="/app/grade/grade.css" />
    <script type="module" src="/app/principal.js"></script>
  </head>
  <body>
    <div id="app" aria-busy="true"></div>
    <noscript>Ligue o JavaScript para abrir.</noscript>
  </body>
</html>
