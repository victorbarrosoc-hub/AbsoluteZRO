<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Relay · OG</title>
    <link rel="stylesheet" href="../app/relay.css" />
    <style>
      body { width: 1200px; height: 630px; overflow: hidden; display: grid; place-items: center; background: #f5f5f7; }
      .og { display: grid; justify-items: center; gap: 44px; }
      .og .rele { --largura: 420px; --altura: 137px; }
      .og h1 { font-size: 64px; line-height: 1.04; text-align: center; }
      .og .assinatura { display: flex; align-items: center; gap: 12px; font: 800 26px/1 var(--fonte-titulo); color: #1d1d1f; }
      .og .assinatura img { width: 40px; height: 40px; border-radius: 10px; }
      .luz { position: absolute; inset: 0; background: radial-gradient(40% 50% at 62% 30%, rgb(216 247 106 / 0.35), transparent 70%), radial-gradient(40% 50% at 40% 40%, rgb(47 217 174 / 0.18), transparent 70%); }
    </style>
  </head>
  <body>
    <div class="luz"></div>
    <div class="og">
      <div class="rele"></div>
      <h1><span class="fino">Do master ao feed.</span> <span class="pesado">Sem perder nada.</span></h1>
      <div class="assinatura"><img src="relay-icone.svg" alt="" />Relay</div>
    </div>
  </body>
</html>
