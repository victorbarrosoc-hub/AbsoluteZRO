<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TPeasy" />
    <title>Controle remoto · TPeasy</title>
    <meta property="og:title" content="Controle remoto do TPeasy" />
    <meta property="og:description" content="Acompanhe e controle o teleprompter de outro aparelho." />
    <meta property="og:image" content="https://tpeasy.absolutezro.com/og.jpg?v=1" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2" />
    <link rel="stylesheet" href="/app/app.css" />
  </head>
  <body class="rc">
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor" stroke="none" /></symbol>
        <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2" fill="currentColor" stroke="none" /><rect x="13.9" y="5" width="3.6" height="14" rx="1.2" fill="currentColor" stroke="none" /></symbol>
        <symbol id="i-rewind" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7" /><path d="M4 4v4h4" /></symbol>
        <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" /></symbol>
        <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></symbol>
        <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-remote" viewBox="0 0 24 24"><rect x="3" y="6" width="8" height="14" rx="2" /><rect x="13" y="4" width="8" height="14" rx="2" /><path d="M7 16.5h.01M17 14.5h.01" /></symbol>
        <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" /><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none" /></symbol>
      </defs>
    </svg>

    <header class="rc-head">
      <a class="icon-btn" href="/app/" aria-label="Voltar ao app"><svg class="icon"><use href="#i-back" /></svg></a>
      <div class="rc-title">
        <b id="rcTitle">Controle remoto</b>
        <span class="rc-status" id="rcStatus"><i></i><span>Desconectado</span></span>
      </div>
      <button class="pill is-small" id="rcLeave" hidden>Sair</button>
    </header>

    <!-- entrar com o código -->
    <section class="rc-join" id="rcJoin">
      <span class="rc-join-ic"><svg class="icon"><use href="#i-remote" /></svg></span>
      <h1>Controlar um TP</h1>
      <p>No celular do TP, toque em <span class="rc-chip"><svg class="icon"><use href="#i-remote" /></svg></span> e aponte a câmera para o QR. Ou digite o código.</p>
      <form id="rcForm" class="rc-form">
        <input class="rc-code" id="rcCode" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCDE" aria-label="Código do TP" required />
        <button class="btn btn-blue btn-block" type="submit">Conectar</button>
      </form>
      <p class="rc-error" id="rcError" hidden></p>
    </section>

    <!-- roteiro sem espelho -->
    <main class="rc-script" id="rcScript" hidden></main>
    <button class="rc-follow" id="rcFollow" hidden><svg class="icon"><use href="#i-target" /></svg>Seguir o TP</button>

    <footer class="rc-bar" id="rcBar" hidden>
      <div class="rc-prog"><i id="rcProg"></i></div>
      <div class="rc-controls">
        <button class="rc-btn" data-c="rewind" aria-label="Do início"><svg class="icon"><use href="#i-rewind" /></svg></button>
        <button class="rc-btn" data-c="block" data-d="-1" aria-label="Parágrafo anterior"><svg class="icon"><use href="#i-up" /></svg></button>
        <button class="rc-play" id="rcPlay" data-c="toggle" aria-label="Rolar"><svg class="icon"><use href="#i-play" /></svg></button>
        <button class="rc-btn" data-c="block" data-d="1" aria-label="Próximo parágrafo"><svg class="icon"><use href="#i-down" /></svg></button>
        <div class="rc-speed">
          <button data-c="speed" data-d="-1" aria-label="Mais devagar"><svg class="icon"><use href="#i-minus" /></svg></button>
          <output id="rcWpm">150</output>
          <button data-c="speed" data-d="1" aria-label="Mais rápido"><svg class="icon"><use href="#i-plus" /></svg></button>
        </div>
      </div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app/js/remote.js"></script>
  </body>
</html>
