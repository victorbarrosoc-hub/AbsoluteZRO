  <body>
    <header class="topo">
      <a class="marca" href="./" aria-label="Revela, página inicial"><img src="marca/revela-logo-claro.png" alt="Revela" width="150" height="28" /></a>
      <a class="conta" id="conta" href="entrar.html">Entrar</a>
    </header>

    <main class="tela tela-lab">
      <section class="abertura entra">
        <p class="sobretitulo">Revela Lab</p>
        <h1>Crie o seu look.</h1>
        <p>Escolha uma base, ajuste do seu jeito, leve a LUT.</p>
      </section>

      <section class="lab-entrada entra" id="lab-entrada">
        <label class="entrada entrada--larga" id="caixa-frame" for="arquivo-frame">
          <span class="entrada-icone" data-icone="filme"></span>
          <strong>Seu frame</strong>
          <span class="ficha" title="Exporte o still do editor já em Rec.709 (depois do CST)">Rec.709</span>
          <span class="acao">Escolher ou soltar</span>
          <input id="arquivo-frame" type="file" accept="image/*" />
        </label>
        <label class="campo-log entrada-lab" title="Still já tratado ou o log da câmera: o Lab leva o frame até a luz da cena do jeito certo"
          ><span data-icone="cst"></span><select id="entrada" aria-label="O frame é"></select
        ></label>
        <div class="exemplo">
          <button id="lab-exemplo" class="vidro" type="button"><span data-icone="imagem"></span> Usar um exemplo</button>
          <label class="vidro" id="abrir-receita" title="Uma receita .revela salva antes"
            ><span data-icone="pasta"></span> Abrir receita<input id="arquivo-receita" type="file" accept=".revela,application/json"
          /></label>
        </div>
      </section>

      <p id="estado" class="estado" role="status" aria-live="polite"></p>

      <section id="lab" class="lab" hidden aria-label="Laboratório">
        <div class="lab-ver">
        <div class="palco">
          <canvas id="previa" aria-label="Seu frame antes e depois do look"></canvas>
          <span class="rotulo rotulo-antes" aria-hidden="true">Antes</span>
          <span class="rotulo rotulo-depois" id="rotulo-depois" aria-hidden="true">Depois</span>
          <input id="divisao" class="divisao" type="range" min="0" max="100" value="50" aria-label="Comparar antes e depois" />
        </div>

        <div class="lab-grupos" id="grupos" role="tablist" aria-label="Bases"></div>
        <div id="bases" class="looks" role="radiogroup" aria-label="Base do look"></div>
        </div>

        <div class="lab-lado">

        <div class="lab-painel">
          <div class="lab-correcao">
            <label class="chave" title="Acerta a exposição e o branco do frame antes da base: o look fica igual em clipes diferentes"
              ><input id="corrigir" type="checkbox" role="switch" checked /><span class="chave-trilho"></span> Analisar e corrigir</label
            >
            <output id="leitura-correcao" class="leitura-correcao"></output>
          </div>

          <div class="controle">
            <label for="intensidade">Intensidade da base</label>
            <output id="valor-intensidade" for="intensidade">100%</output>
            <input id="intensidade" type="range" min="0" max="100" value="100" />
          </div>

          <label class="campo-log copia-lab" title="Copia o look numa película de cinema, com as curvas das fichas técnicas"
            ><span data-icone="looks"></span><select id="copia" aria-label="Cópia de cinema"></select
          ></label>

          <div id="ajustes" class="ajustes-lab" aria-label="Ajustes"></div>
          <button id="zerar" class="vidro" type="button"><span data-icone="x"></span> Zerar ajustes</button>
        </div>

        <div class="lab-saida">
          <input id="nome-look" class="nome-look" type="text" maxlength="40" value="Meu look" aria-label="Nome do look" autocomplete="off" />
          <div class="exportar">
            <label class="campo-log"
              ><span data-icone="tela"></span
              ><select id="editor" aria-label="Para qual editor">
                <option value="resolve">DaVinci Resolve</option>
                <option value="premiere">Premiere Pro</option>
                <option value="fcp">Final Cut Pro</option>
                <option value="capcut">CapCut</option>
              </select></label
            >
            <div class="segmentado" id="tamanhos" role="radiogroup" aria-label="Tamanho da LUT">
              <label title="Monitor e câmera"><input type="radio" name="tamanho" value="33" checked /> 33</label>
              <label title="Grading"><input type="radio" name="tamanho" value="65" /> 65</label>
            </div>
          </div>
          <button id="baixar" class="vidro vidro--tinta grande" type="button"><span data-icone="baixar"></span> Baixar LUT</button>
          <button
            id="baixar-pacote"
            class="vidro grande"
            type="button"
            title="Look em DaVinci Wide Gamut/Intermediate e ACEScct (65, .cube e CLF), LUT do monitor, LUT Rec.709, CDL, receita e controle de qualidade"
          >
            <span data-icone="pasta"></span> Pacote profissional
          </button>
          <p id="qc" class="qc" role="status" hidden></p>
          <div class="lab-acoes">
            <button id="salvar" class="vidro" type="button" title="Entra em Meus looks, na tela de LUT, neste navegador"><span data-icone="brilho"></span> Salvar em Meus looks</button>
            <button id="baixar-receita" class="vidro" type="button" title="Arquivo .revela: reabre aqui com a base e os ajustes"><span data-icone="copiar"></span> Baixar receita</button>
          </div>
        </div>
        </div>
      </section>

      <footer class="rodape entra"><span data-icone="cadeado"></span> Suas imagens não saem daqui</footer>
    </main>
    <nav class="abas" aria-label="Ferramentas da Revela">
