<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Revela Lab · crie o seu look</title>
    <meta name="description" content="Monte o seu look: película, clássicos ou os looks da Revela, com ajustes simples. Sai uma LUT para os seus projetos." />
    <meta name="color-scheme" content="light" />
    <script src="app/tema.js"></script>
    <script src="app/abertura.js"></script>
    <meta name="theme-color" content="#f5f5f7" />
    <link rel="canonical" href="https://revela.absolutezro.com/lab" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Revela" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://revela.absolutezro.com/" />
    <meta property="og:title" content="Revela Lab · crie o seu look" />
    <meta property="og:description" content="Monte o seu look: película, clássicos ou os looks da Revela, com ajustes simples. Sai uma LUT para os seus projetos." />
    <meta property="og:image" content="https://revela.absolutezro.com/og.jpg?v=3" />
    <meta property="og:image:secure_url" content="https://revela.absolutezro.com/og.jpg?v=3" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Revela: revela a cor que você quer. Um frame de referência vira uma LUT para o DaVinci Resolve." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Revela Lab · crie o seu look" />
    <meta name="twitter:description" content="Monte o seu look: película, clássicos ou os looks da Revela, com ajustes simples. Sai uma LUT para os seus projetos." />
    <meta name="twitter:image" content="https://revela.absolutezro.com/og.jpg?v=3" />
    <meta name="twitter:image:alt" content="Revela: revela a cor que você quer. Um frame de referência vira uma LUT para o DaVinci Resolve." />
    <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="marca/app/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Revela" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="marca/revela-icone.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="app/revela.css" />
    <script type="module" src="app/lab.js"></script>
  </head>
  <body>
    <header class="topo">
      <a class="marca" href="./" aria-label="Revela, página inicial"><img src="marca/revela-logo-claro.png" alt="Revela" width="150" height="28" /></a>
      <a class="topo-z" href="inicio.html" aria-label="Z, a IA da Absolute ZRO" title="Z, a IA da Absolute ZRO"><span class="aba-icone" data-icone="z"></span></a>
      <a class="conta" id="conta" href="entrar.html">Entrar</a>
    </header>

    <main class="tela tela-lab">
      <section class="abertura entra">
        <p class="sobretitulo">Revela Lab</p>
        <h1>Crie o seu look.</h1>
        <p>Escolha uma base, ajuste do seu jeito, leve a LUT.</p>
      </section>

      <section class="lab-entrada entra" id="lab-entrada">
        <label class="entrada entrada--larga" id="caixa-frame" for="arquivo-frame">
          <span class="entrada-icone" data-icone="filme"></span>
          <strong>Seu frame</strong>
          <span class="ficha" title="Still já tratado ou o log da câmera: o Autopilot reconhece">Still ou log</span>
          <span class="acao">Escolher ou soltar</span>
          <input id="arquivo-frame" type="file" accept="image/*" />
        </label>
        <div class="exemplo">
          <button id="lab-exemplo" class="vidro" type="button"><span data-icone="imagem"></span> Usar um exemplo</button>
          <label class="vidro" id="abrir-receita" title="Uma receita .revela salva antes"
            ><span data-icone="pasta"></span> Abrir receita<input id="arquivo-receita" type="file" accept=".revela,application/json"
          /></label>
        </div>
      </section>

      <p id="estado" class="estado" role="status" aria-live="polite"></p>

      <section id="lab" class="lab" hidden aria-label="Laboratório">
        <div class="lab-ver">
        <div class="palco">
          <canvas id="previa" aria-label="Seu frame antes e depois do look"></canvas>
          <span class="rotulo rotulo-antes" aria-hidden="true">Antes</span>
          <span class="rotulo rotulo-depois" id="rotulo-depois" aria-hidden="true">Depois</span>
          <input id="divisao" class="divisao" type="range" min="0" max="100" value="50" aria-label="Comparar antes e depois" />
          <button id="imagem-cheia" class="palco-botao" type="button" aria-label="Mais imagem" title="Mais imagem: a prévia na tela toda, com os controles numa barra">
            <span data-icone="ampliar"></span>
          </button>
          <div id="hud" class="hud" role="toolbar" aria-label="Controles sobre a imagem" hidden>
            <div class="hud-passos">
              <div class="hud-passo" data-passo="base" title="Look">
                <button type="button" data-ir="-1" aria-label="Look: anterior">‹</button>
                <output id="hud-base" aria-label="Look"></output>
                <button type="button" data-ir="1" aria-label="Look: próximo">›</button>
              </div>
              <div class="hud-passo" data-passo="negativo" title="Negativo">
                <button type="button" data-ir="-1" aria-label="Negativo: anterior">‹</button>
                <output id="hud-negativo" aria-label="Negativo"></output>
                <button type="button" data-ir="1" aria-label="Negativo: próximo">›</button>
              </div>
              <div class="hud-passo" data-passo="copia" title="Cópia">
                <button type="button" data-ir="-1" aria-label="Cópia: anterior">‹</button>
                <output id="hud-copia" aria-label="Cópia"></output>
                <button type="button" data-ir="1" aria-label="Cópia: próximo">›</button>
              </div>
            </div>
            <div class="hud-ajuste">
              <div class="hud-ferramentas" id="hud-ferramentas" role="radiogroup" aria-label="Ajuste"></div>
              <label class="hud-valor" title="Duplo clique volta ao neutro"
                ><span id="hud-nome"></span><output id="hud-numero" for="hud-barra"></output><input id="hud-barra" type="range" aria-label="Valor do ajuste"
              /></label>
            </div>
            <div class="hud-acoes">
              <button id="hud-comparar" type="button" aria-pressed="false" title="Segure para ver o frame antes do look">Antes</button>
              <button id="hud-sair" type="button" aria-label="Voltar ao painel" title="Voltar ao painel (Esc)"><span data-icone="x"></span></button>
            </div>
          </div>
        </div>

        <div class="lab-grupos" id="grupos" role="tablist" aria-label="Bases"></div>
        <div id="bases" class="looks" role="radiogroup" aria-label="Base do look"></div>
        </div>

        <div class="lab-lado">

        <div class="lab-painel">
          <section class="etapa" aria-labelledby="etapa-camera">
            <h2 class="etapa-titulo" id="etapa-camera"><span class="etapa-n">1</span> Câmera</h2>
            <p id="autopilot" class="autopilot" role="status" title="O Autopilot lê o frame: se é log ou já tratado e, com pista, de qual câmera">
              <span data-icone="brilho"></span><span id="autopilot-frase">Autopilot</span>
            </p>
            <label class="campo-log entrada-lab" title="Still já tratado ou o log da câmera: o Lab leva o frame até a luz da cena do jeito certo"
              ><span data-icone="cst"></span><select id="entrada" aria-label="O frame é"></select
            ></label>
            <div class="lab-correcao">
              <label class="chave" title="Acerta a exposição e o branco do frame antes da base: o look fica igual em clipes diferentes"
                ><input id="corrigir" type="checkbox" role="switch" checked /><span class="chave-trilho"></span> Analisar e corrigir</label
              >
              <output id="leitura-correcao" class="leitura-correcao"></output>
            </div>
            <div id="ajustes-camera" class="ajustes-lab" aria-label="Exposição e branco"></div>
          </section>

          <section class="etapa" aria-labelledby="etapa-negativo">
            <h2 class="etapa-titulo" id="etapa-negativo"><span class="etapa-n">2</span> Negativo <output id="qual-negativo" class="etapa-qual"></output></h2>
            <div id="latas" class="latas" role="radiogroup" aria-label="Negativo"></div>
            <select id="negativo" aria-label="Negativo" hidden></select>
            <div class="etapa-linha" title="Forçar ou puxar a revelação do negativo">
              <span class="etapa-rotulo">Revelação</span>
              <div class="lab-grupos" id="revelacoes" role="radiogroup" aria-label="Revelação"></div>
              <select id="revelacao" aria-label="Revelação" hidden></select>
            </div>
          </section>

          <section class="etapa" aria-labelledby="etapa-copia">
            <h2 class="etapa-titulo" id="etapa-copia"><span class="etapa-n">3</span> Cópia <output id="qual-copia" class="etapa-qual"></output></h2>
            <div class="lab-grupos" id="copias" role="radiogroup" aria-label="Cópia de cinema"></div>
            <select id="copia" aria-label="Cópia de cinema" hidden></select>
            <div class="etapa-linha" title="Luz do projetor: muda o branco da cópia">
              <span class="etapa-rotulo">Luz</span>
              <div class="lab-grupos" id="luzes" role="radiogroup" aria-label="Luz da cópia"></div>
              <select id="luz-copia" aria-label="Luz da cópia" hidden></select>
            </div>
            <label class="chave" title="Cópia com menos pé e ombro: altas mais altas, sombras mais fundas"
              ><input id="expandido" type="checkbox" role="switch" /><span class="chave-trilho"></span> Expandido</label
            >
          </section>

          <section class="etapa" aria-labelledby="etapa-look">
            <h2 class="etapa-titulo" id="etapa-look"><span class="etapa-n">4</span> Look</h2>
            <div class="controle">
              <label for="intensidade">Intensidade da base</label>
              <output id="valor-intensidade" for="intensidade">100%</output>
              <input id="intensidade" type="range" min="0" max="100" value="100" />
            </div>
            <div id="ajustes" class="ajustes-lab" aria-label="Ajustes"></div>
            <details class="fino-lab">
              <summary>Ajuste fino</summary>
              <div id="ajustes-finos" class="ajustes-lab" aria-label="Ajuste fino"></div>
            </details>
          </section>

          <section class="etapa textura-lab" aria-labelledby="etapa-textura">
            <h2 class="etapa-titulo" id="etapa-textura"><span class="etapa-n">5</span> Textura</h2>
            <div class="lab-grupos" id="texturas" role="radiogroup" aria-label="Textura"></div>
            <div id="ajustes-textura" class="ajustes-lab" aria-label="Textura"></div>
            <details class="fino-lab">
              <summary>Mais textura</summary>
              <div id="ajustes-textura-finos" class="ajustes-lab" aria-label="Mais textura"></div>
            </details>
          </section>
          <button id="zerar" class="vidro" type="button"><span data-icone="x"></span> Zerar ajustes</button>
        </div>

        <div class="lab-saida">
          <input id="nome-look" class="nome-look" type="text" maxlength="40" value="Meu look" aria-label="Nome do look" autocomplete="off" />
          <div class="exportar">
            <label class="campo-log"
              ><span data-icone="tela"></span
              ><select id="editor" aria-label="Para qual editor">
                <option value="resolve">DaVinci Resolve</option>
                <option value="premiere">Premiere Pro</option>
                <option value="fcp">Final Cut Pro</option>
                <option value="capcut">CapCut</option>
              </select></label
            >
            <div class="segmentado" id="tamanhos" role="radiogroup" aria-label="Tamanho da LUT">
              <label title="Monitor e câmera"><input type="radio" name="tamanho" value="33" checked /> 33</label>
              <label title="Grading"><input type="radio" name="tamanho" value="65" /> 65</label>
            </div>
          </div>
          <button id="baixar" class="vidro vidro--tinta grande" type="button"><span data-icone="baixar"></span> Baixar LUT</button>
          <button
            id="baixar-pacote"
            class="vidro grande"
            type="button"
            title="Look em DaVinci Wide Gamut/Intermediate e ACEScct (65, .cube e CLF), LUT do monitor, LUT Rec.709, CDL, receita e controle de qualidade"
          >
            <span data-icone="pasta"></span> Pacote profissional
          </button>
          <button
            id="baixar-no"
            class="vidro grande"
            type="button"
            title="O Lab dentro do DaVinci Resolve Studio: um nó (.dctl) com o look, o negativo, a cópia e os ajustes, aberto com esta receita"
          >
            <span data-icone="cst"></span> Nó para o DaVinci
          </button>
          <p id="qc" class="qc" role="status" hidden></p>
          <div class="lab-acoes">
            <button id="salvar" class="vidro" type="button" title="Entra em Meus looks, na tela de LUT, neste navegador"><span data-icone="brilho"></span> Salvar em Meus looks</button>
            <button id="baixar-receita" class="vidro" type="button" title="Arquivo .revela: reabre aqui com a base e os ajustes"><span data-icone="copiar"></span> Baixar receita</button>
          </div>
          <button id="abrir-ficha" class="vidro grande" type="button" title="O quadro com o look, a paleta, a técnica e os créditos, em PNG"><span data-icone="imagem"></span> Ficha de apresentação</button>
        </div>
        </div>
      </section>

      <dialog id="ficha" class="folha-ficha" aria-label="Ficha de apresentação">
        <div class="ficha-ver"><canvas id="ficha-tela" aria-label="Prévia da ficha"></canvas></div>
        <form class="ficha-campos" method="dialog">
          <input id="ficha-titulo" class="nome-look" type="text" maxlength="48" placeholder="Título" aria-label="Título" autocomplete="off" />
          <div class="ficha-grade">
            <label class="ficha-campo"><span>Direção</span><input id="ficha-direcao" type="text" maxlength="40" autocomplete="off" /></label>
            <label class="ficha-campo"><span>Fotografia</span><input id="ficha-fotografia" type="text" maxlength="40" autocomplete="off" /></label>
            <label class="ficha-campo"><span>Cor</span><input id="ficha-cor" type="text" maxlength="40" autocomplete="off" /></label>
            <label class="ficha-campo"><span>Ano</span><input id="ficha-ano" type="text" maxlength="12" autocomplete="off" inputmode="numeric" /></label>
            <label class="ficha-campo"><span>Câmera</span><input id="ficha-camera" type="text" maxlength="40" autocomplete="off" /></label>
          </div>
          <div class="ficha-opcoes">
            <div class="segmentado" id="ficha-formatos" role="radiogroup" aria-label="Formato da ficha">
              <label><input type="radio" name="ficha-formato" value="quadrada" checked /> Quadrada</label>
              <label><input type="radio" name="ficha-formato" value="panoramica" /> Panorâmica</label>
            </div>
            <div class="segmentado" id="ficha-temas" role="radiogroup" aria-label="Cor da ficha">
              <label><input type="radio" name="ficha-tema" value="claro" checked /> Clara</label>
              <label><input type="radio" name="ficha-tema" value="escuro" /> Escura</label>
            </div>
          </div>
          <div class="ficha-acoes">
            <button id="ficha-fechar" class="vidro" type="submit">Fechar</button>
            <button id="ficha-baixar" class="vidro vidro--tinta" type="button"><span data-icone="baixar"></span> Baixar PNG</button>
          </div>
        </form>
      </dialog>

      <footer class="rodape entra"><span data-icone="cadeado"></span> Suas imagens não saem daqui</footer>
    </main>
    <nav class="abas" aria-label="Ferramentas da Revela">
      <a href="lut.html"><span class="aba-icone" data-icone="lut"></span>LUT</a>
      <a href="lab.html" aria-current="page"><span class="aba-icone" data-icone="lab"></span>Lab</a>
      <a href="cst.html"><span class="aba-icone" data-icone="cst"></span>CST</a>
      <a href="entrega.html"><span class="aba-icone" data-icone="entrega"></span>Entrega</a>
      <a href="converter.html"><span class="aba-icone" data-icone="converter"></span>Converter</a>
    </nav>
  </body>
</html>
