  </head>
  <body>
    <header class="topo">
      <a class="marca" href="./" aria-label="Revela, página inicial"><img src="marca/revela-logo-claro.png" alt="Revela" width="150" height="28" /></a>
      <a class="topo-z" href="inicio.html" aria-label="Z, a IA da Absolute ZRO" title="Z, a IA da Absolute ZRO"><span class="aba-icone" data-icone="z"></span></a>
      <a class="conta" id="conta" href="entrar.html">Entrar</a>
    </header>

    <main class="tela tela--estreita">
      <section class="abertura entra">
        <h1>Converta aqui mesmo.</h1>
        <p>Do ProRes ao destino, no celular ou no computador.</p>
      </section>

      <label class="soltar entra" id="caixa-arquivos" for="arquivos">
        <span class="soltar-icone" data-icone="soltar"></span>
        <strong class="soltar-titulo">Solte seus vídeos</strong>
        <span class="soltar-dica">ou toque para escolher</span>
        <input id="arquivos" type="file" accept="video/*,.mov,.mp4,.m4v,.mxf" multiple />
      </label>

      <ol id="fila" class="fila" aria-label="Arquivos"></ol>

      <section class="ajustes entra" aria-label="Ajustes">
        <div class="cartoes cartoes--4" id="destinos" role="radiogroup" aria-label="Destino"></div>
        <div class="linha-ajustes">
          <div class="segmentado" id="resolucoes" role="radiogroup" aria-label="Resolução"></div>
          <label class="campo-log" title="Gravou em log? Escolha a câmera: sai em Rec.709, com as curvas do CST da Revela"
            ><span data-icone="cst"></span
            ><select id="cst" aria-label="Log da câmera">
              <option value="">Sem log</option>
            </select></label
          >
          <label class="chave" id="opcao-pasta" hidden title="Grava direto no disco: melhor para arquivos grandes"
            ><input id="salvar-pasta" type="checkbox" role="switch" checked /><span class="chave-trilho"></span> Salvar numa pasta</label
          >
        </div>
        <button id="converter" class="vidro vidro--tinta grande" type="button" disabled><span data-icone="converter"></span> Converter</button>
      </section>

      <p id="estado" class="estado" role="status" aria-live="polite"></p>

      <footer class="rodape entra">
        <span data-icone="cadeado"></span> Nada sai do seu aparelho
        <span id="aparelho" class="capacidades" aria-label="Codificadores deste aparelho"></span>
      </footer>
    </main>
    <nav class="abas" aria-label="Ferramentas da Revela">
      <a href="lut.html"><span class="aba-icone" data-icone="lut"></span>LUT</a>
      <a href="lab.html"><span class="aba-icone" data-icone="lab"></span>Lab</a>
      <a href="cst.html"><span class="aba-icone" data-icone="cst"></span>CST</a>
      <a href="entrega.html"><span class="aba-icone" data-icone="entrega"></span>Entrega</a>
      <a href="converter.html" aria-current="page"><span class="aba-icone" data-icone="converter"></span>Converter</a>
    </nav>
  </body>
</html>
