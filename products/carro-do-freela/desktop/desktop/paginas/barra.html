<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="dark" />
    <title>Carro do Freela</title>
    <link rel="stylesheet" href="barra.css" />
  </head>
  <body>
    <header class="barra">
      <div class="barra__semaforo" aria-hidden="true"></div>
      <nav class="barra__nav" aria-label="Navegação">
        <button id="voltar" class="icone" type="button" title="Voltar (⌘[)" aria-label="Voltar" disabled>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" /></svg>
        </button>
        <button id="avancar" class="icone" type="button" title="Avançar (⌘])" aria-label="Avançar" disabled>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" /></svg>
        </button>
      </nav>
      <div class="barra__titulo">
        <img src="simbolo.png" alt="" width="18" height="18" />
        <span id="titulo">Carro do Freela</span>
      </div>
      <nav class="barra__nav barra__nav--fim" aria-label="Página">
        <button id="atualizar" class="pilula" type="button" title="Atualizar na Absolute ZRO" hidden>Atualização disponível</button>
        <button id="recarregar" class="icone" type="button" title="Recarregar (⌘R)" aria-label="Recarregar">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5V5h-2.5" /></svg>
        </button>
        <button id="inicio" class="icone" type="button" title="Início (⇧⌘H)" aria-label="Início">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.5 8 3l5.5 4.5M4 6.5V13h3V9.5h2V13h3V6.5" /></svg>
        </button>
      </nav>
      <div id="carregando" class="barra__carregando" aria-hidden="true"></div>
    </header>
    <script src="barra.js"></script>
  </body>
</html>
