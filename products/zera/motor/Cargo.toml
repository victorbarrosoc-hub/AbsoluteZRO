[package]
name = "zera-motor"
version = "0.1.0"
edition = "2021"
description = "Motor do ZERA: varre o disco em paralelo e responde à interface por linhas JSON."
license = "UNLICENSED"
publish = false

[[bin]]
name = "zera-motor"
path = "src/main.rs"

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
