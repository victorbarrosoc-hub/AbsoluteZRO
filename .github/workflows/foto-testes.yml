# Testes da plataforma de fotos (products/foto, ADR 0044): o app fechado (gate, página neutra, o que o estático leva), o
# login único contra a Absolute ZRO falsa, o banco num Postgres de verdade, as bibliotecas de vendor/ contra os pacotes,
# os modelos de visão pelo sha256 e a casca no Chromium com os cabeçalhos de produção, além dos testes do núcleo.
# Roda quando a pasta ou este arquivo mudam. FOTO_EXIGIR=1: o que falta (Postgres, Chromium, modelo) vira falha, não pulo.
name: Fotos · testes

on:
  push:
    branches: [main]
    paths:
      - 'products/foto/**'
      - '.github/workflows/foto-testes.yml'
  pull_request:
    paths:
      - 'products/foto/**'
      - '.github/workflows/foto-testes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foto-testes-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: products/foto

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/foto/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # o banco dos testes é um cluster temporário (initdb): só precisa dos binários do Postgres na máquina
      - name: Postgres para os testes
        run: ls /usr/lib/postgresql/*/bin/initdb || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql)
      # os modelos de visão não ficam no git: baixa dos endereços oficiais e confere o sha256 (falha se faltar)
      - run: node scripts/modelos.mjs
      - run: FOTO_EXIGIR=1 npm test
      - run: node publicar.mjs
