# Testes do rádio do set (products/radio, ADR 0042): o gate e o login (api/zro), o banco próprio num Postgres de
# verdade (migração, isolamento pelo RLS, quem manda aviso) e a voz de ponta a ponta em três Chromium (WebRTC).
# Roda quando a pasta ou este arquivo mudam.
name: Rádio do set · testes

on:
  push:
    branches: [main]
    paths:
      - 'products/radio/**'
      - '.github/workflows/radio-testes.yml'
  pull_request:
    paths:
      - 'products/radio/**'
      - '.github/workflows/radio-testes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radio-testes-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: products/radio

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/radio/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: node publicar.mjs && node --check app/app.js && node --check app/rtc.js
