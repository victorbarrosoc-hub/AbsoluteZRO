# Testes da Revela (products/finishing): referência → LUT, entrega, conversor (ProRes gerado pelo ffmpeg) e as telas
# no Chromium.
# Roda só quando a pasta (ou este arquivo) muda.
name: Revela · testes

on:
  push:
    branches: [main]
    paths:
      - 'products/finishing/**'
      - '.github/workflows/finishing-testes.yml'
  pull_request:
    paths:
      - 'products/finishing/**'
      - '.github/workflows/finishing-testes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finishing-testes-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: products/finishing

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/finishing/package-lock.json
      # só o ffmpeg e o que ele exige (sem drivers de vídeo e reconhecimento de voz recomendados): o espelho do apt às
      # vezes fica lento e a lista completa (~94 MB) estourava o tempo do job
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=3 ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
