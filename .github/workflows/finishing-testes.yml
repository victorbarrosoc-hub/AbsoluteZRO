# Testes do Finishing (products/finishing): referência → LUT, .cube, PNG e linha de comando. Sem dependências: não
# há npm ci. Roda só quando a pasta do Finishing (ou este arquivo) muda.
name: Finishing · testes

on:
  push:
    branches: [main]
    paths:
      - 'products/finishing/**'
      - '.github/workflows/finishing-testes.yml'
  pull_request:
    paths:
      - 'products/finishing/**'
      - '.github/workflows/finishing-testes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finishing-testes-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: products/finishing

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm test
