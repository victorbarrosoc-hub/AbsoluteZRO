# Absolute ZRO para computador (apps/hub-desktop): gera o .dmg num Mac e o .exe num Windows do GitHub e publica no
# Release "hub-desktop". O HUB entrega por /baixar/hub/mac e /baixar/hub/windows (apps/hub-web/app/(site)/baixar/hub).
# Mac e Windows só rodam na main quando o app muda, em tags hub-desktop-v* e pelo botão "Run workflow": em pull
# request, só os testes em Ubuntu (minuto de Mac custa 10 vezes o de Linux).
name: Absolute ZRO · app para computador

on:
  push:
    branches: [main]
    tags: ['hub-desktop-v*']
    paths:
      - 'apps/hub-desktop/**'
      - '.github/workflows/hub-desktop.yml'
  pull_request:
    paths:
      - 'apps/hub-desktop/**'
      - '.github/workflows/hub-desktop.yml'
  workflow_dispatch:

# Só leitura por padrão; escrita só nos jobs que publicam no Release.
# As actions de fora vão fixadas pelo SHA do commit (com a tag ao lado), como no Synquei.
permissions:
  contents: read

concurrency:
  group: hub-desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/hub-desktop

env:
  HUB_DESKTOP_TAG: hub-desktop
  HUB_DESKTOP_BUILD_BASE: '0'

jobs:
  testes:
    name: Testes (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/hub-desktop/package-lock.json
      - run: npm ci
      - run: npm test
      # Teste de fumaça no Linux (Xvfb): abre a janela com a tela "Sem conexão" local e escreve "SMOKE OK".
      - name: Teste de fumaça (Linux)
        run: |
          export ZRO_SMOKE_SAIDA="$RUNNER_TEMP/smoke.txt"
          xvfb-run -a npx electron . --smoke --no-sandbox
          cat "$ZRO_SMOKE_SAIDA"
          grep -q '^SMOKE OK$' "$ZRO_SMOKE_SAIDA"

  app:
    name: App (${{ matrix.label }})
    if: github.event_name != 'pull_request'
    needs: testes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: Mac
            plataforma: mac
            build: npm run dist:mac
          - os: windows-latest
            label: Windows
            plataforma: windows
            build: npm run dist:win
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/hub-desktop/package-lock.json
      - run: npm ci
      # Identidade do build (vai dentro do app): o aviso de versão nova compara com o versao.json do HUB.
      - run: node scripts/release.mjs build-info
      - run: ${{ matrix.build }}
      # Teste de fumaça do app empacotado: abre a janela de verdade com a tela "Sem conexão" local (sem rede),
      # confere a ponte, o isolamento e as regras de navegação e escreve "SMOKE OK". Qualquer outra coisa falha antes de publicar.
      - if: matrix.plataforma == 'mac'
        name: Teste de fumaça (Mac)
        timeout-minutes: 5
        run: |
          export ZRO_SMOKE_SAIDA="$RUNNER_TEMP/smoke.txt"
          code=0
          "dist/mac-universal/Absolute ZRO.app/Contents/MacOS/Absolute ZRO" --smoke || code=$?
          echo "--- resultado (saída $code) ---"
          cat "$ZRO_SMOKE_SAIDA" || true
          test "$code" -eq 0
          grep -q '^SMOKE OK$' "$ZRO_SMOKE_SAIDA"
      - if: matrix.plataforma == 'windows'
        name: Teste de fumaça (Windows)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:ZRO_SMOKE_SAIDA = Join-Path $env:RUNNER_TEMP 'smoke.txt'
          $p = Start-Process -FilePath 'dist\win-unpacked\Absolute ZRO.exe' -ArgumentList '--smoke' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(180000)) { $p.Kill($true); Write-Error 'o teste de fumaça passou de 3 minutos'; exit 1 }
          Write-Output "--- resultado (saída $($p.ExitCode)) ---"
          Get-Content $env:ZRO_SMOKE_SAIDA -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Select-String -Path $env:ZRO_SMOKE_SAIDA -Pattern '^SMOKE OK$' -Quiet)) { exit 1 }
      # O SHA-256 vai para o Release junto do instalador.
      - run: node scripts/release.mjs nomear ${{ matrix.plataforma }} dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: hub-desktop
          name: Absolute ZRO · app para computador
          target_commitish: ${{ github.sha }}
          files: |
            apps/hub-desktop/dist/AbsoluteZRO-*-mac-universal.dmg
            apps/hub-desktop/dist/AbsoluteZRO-*-windows-setup.exe
            apps/hub-desktop/dist/AbsoluteZRO-sha256-*.json
          fail_on_unmatched_files: false
          body: Absolute ZRO para computador, a central que instala e atualiza todos os apps. Instale em absolutezro.com/baixar; depois ela se atualiza sozinha.

  # Depois dos DOIS instaladores no Release: o versao.json com o SHA-256 de cada um (o HUB serve em /baixar/hub/versao).
  versao:
    name: Publicar versão
    if: github.event_name != 'pull_request'
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: gh release download hub-desktop -R "$GITHUB_REPOSITORY" -p "AbsoluteZRO-sha256-*.json" -D sha256
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/release.mjs versao sha256 versao.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: hub-desktop
          name: Absolute ZRO · app para computador
          target_commitish: ${{ github.sha }}
          files: apps/hub-desktop/versao.json
          fail_on_unmatched_files: true
          body: Absolute ZRO para computador, a central que instala e atualiza todos os apps. Instale em absolutezro.com/baixar; depois ela se atualiza sozinha.
      - run: node scripts/release.mjs limpar
        env:
          GITHUB_TOKEN: ${{ github.token }}
