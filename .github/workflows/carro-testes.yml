# Testes do Carro do Freela (products/carro-do-freela): login Absolute ZRO contra um HUB falso, o banco (Postgres), o build do domínio
# (o mesmo que a Vercel roda) e a bateria de navegador. Roda só quando a pasta do Carro (ou este arquivo) muda.
name: Carro do Freela · testes

on:
  push:
    branches: [main]
    paths:
      - 'products/carro-do-freela/**'
      - '.github/workflows/carro-testes.yml'
  pull_request:
    paths:
      - 'products/carro-do-freela/**'
      - '.github/workflows/carro-testes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carro-testes-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: products/carro-do-freela

jobs:
  servidor:
    name: Login e build do domínio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # desde 26/out o build minifica o script e a folha com o esbuild (a única
      # dependência, só de build) — o mesmo `npm ci` que o vercel.json roda
      - name: Dependências do build
        run: npm ci --no-audit --no-fund
      - name: Login Absolute ZRO (OIDC falso, chave EC P-256)
        run: npm run test:api
      # (28/out) o banco do Carro: migrações, RLS com duas contas, fila do inventário no contrato
      # freela.inventario/1 e as rotas de perfil e inventário (a parte de tela pula aqui: sem Playwright)
      - name: Banco do Carro (Postgres descartável)
        run: npm run test:banco
      - name: Build do domínio, sem chaves (como um Preview sem variáveis)
        run: npm run build:vercel
      - name: Nada de chave nem marcador no que iria ao ar
        run: |
          ! grep -RlE 'eyJhbGciOi[A-Za-z0-9_-]{20,}\.|__(WEB3FORMS_KEY|SUPABASE_URL|SUPABASE_ANON_KEY)__' .vercel/output

  navegador:
    name: Bateria de navegador
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependências do build (o esbuild; o Playwright continua global)
        run: npm ci --no-audit --no-fund
      - name: Playwright e Chromium (o protótipo não tem node_modules de propósito)
        run: |
          npm install -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
          echo "CHROME=$(NODE_PATH=$(npm root -g) node -p "require('playwright').chromium.executablePath()")" >> "$GITHUB_ENV"
      # o arnês gera os sete builds (completo + seis fases) quando a lista tem
      # uma suíte que lê os arquivos das fases (test/run.js, DAS_FASES)
      - name: Bateria
        run: npm test
      - name: Meu perfil e Meu inventário na tela (Chromium + Postgres)
        run: node --test test/api/banco-tela.test.js
      - name: A CSP do build do domínio, provada num Chromium
        run: |
          npm run build:vercel
          node src/blindar.js .vercel/output/static > blindar.json
          node -e "const r=require('./blindar.json'); if(r.erro||r.arquivos.length!==7||r.arquivos.some(a=>!a.ok)){console.error(JSON.stringify(r).slice(0,2000));process.exit(1)} console.log('CSP provada nos 7 HTML')"
