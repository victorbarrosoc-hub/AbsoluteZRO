name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/zro_test
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/zro_e2e_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npx -y npm@11.6.2 ci
      - name: Segredos no código
        run: node scripts/scan-secrets.mjs
      - name: Lint
        run: npm run lint
      - name: Formatação
        run: npm run format:check
      - name: Tipos
        run: npm run typecheck
      - name: Testes (unitários e integração com Postgres)
        run: npm test
      - name: Build
        run: npm run build
      - name: Playwright (Chromium)
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run test:e2e
