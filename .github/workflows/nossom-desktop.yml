name: NOSSOM · instaladores desktop
# Releases deste app usam a tag nossom-v<versão> (o repositório guarda várias plataformas). As prévias antigas
# (desktop-v*) seguem baixáveis no repositório arquivado victorbarrosoc-hub/nossom.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        options: [all, mac, win]
        default: all
      publish_preview:
        description: Publish available installers as a public test release
        type: boolean
        default: false
      publish_signed:
        description: Publish a signed stable release with automatic updates (all platforms required)
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    working-directory: products/nossom
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ inputs.platform == 'mac' && fromJSON('["mac"]') || inputs.platform == 'win' && fromJSON('["win"]') || fromJSON('["mac","win"]') }}
        arch: [arm64, x64]
        exclude:
          - platform: win
            arch: arm64
    runs-on: ${{ matrix.platform == 'mac' && 'macos-15' || 'windows-latest' }}
    timeout-minutes: 20
    steps:
      - name: Validate publication mode
        shell: bash
        env:
          SIGNED: ${{ inputs.publish_signed }}
          PREVIEW: ${{ inputs.publish_preview }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          if [ "$SIGNED" = true ] && { [ "$PLATFORM" != all ] || [ "$PREVIEW" = true ]; }; then
            echo 'Signed publication requires all platforms and publish_preview=false.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: products/nossom/desktop/package-lock.json
      - run: npm ci
        working-directory: products/nossom/desktop
      - name: Inspect previous Mac preview
        if: matrix.platform == 'mac'
        shell: bash
        # Prévia histórica 0.1.0, no repositório antigo (arquivado e privado). O token do Actions só lê este
        # repositório: sem acesso, a inspeção (só diagnóstico) é pulada em vez de travar o build.
        run: |
          if ! curl --fail --location --silent --show-error "https://github.com/victorbarrosoc-hub/nossom/releases/download/desktop-v0.1.0/NOSSOM-0.1.0-mac-${{ matrix.arch }}.zip" -o "$RUNNER_TEMP/previous.zip"; then
            echo '::notice::Prévia 0.1.0 inacessível (repositório antigo privado); inspeção pulada.'
            exit 0
          fi
          ditto -x -k "$RUNNER_TEMP/previous.zip" "$RUNNER_TEMP/previous"
          python3 desktop/verify-mac.py "$RUNNER_TEMP/previous/NOSSOM.app" --inspect
      - name: Package installer
        shell: bash
        run: |
          set -o pipefail
          npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }} 2>&1 | tee "$RUNNER_TEMP/nossom-build.log"
        working-directory: products/nossom/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Canal fixo do NOSSOM (release nossom-atualizacoes), lido pelo site: o repositório é privado, então o app
          # pergunta a /baixar/atualizacoes/<arquivo>, que redireciona para o endereço assinado do GitHub.
          NOSSOM_UPDATE_BASE_URL: ${{ inputs.publish_signed && 'https://nossom-teal.vercel.app/baixar/atualizacoes' || vars.NOSSOM_UPDATE_BASE_URL }}
          NOSSOM_UPDATE_FLAT_FEED: ${{ inputs.publish_signed && 'true' || 'false' }}
          NOSSOM_WINDOWS_PUBLISHER: ${{ vars.NOSSOM_WINDOWS_PUBLISHER }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Validate Mac bundle and installer
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ matrix.arch }}" = arm64 ]; then app=dist/mac-arm64/NOSSOM.app; else app=dist/mac/NOSSOM.app; fi
          python3 verify-mac.py "$app" 2>&1 | tee -a "$RUNNER_TEMP/nossom-build.log"
          for dmg in dist/*.dmg; do hdiutil verify "$dmg"; done
        working-directory: products/nossom/desktop
      - name: Verify Apple notarization
        if: matrix.platform == 'mac' && inputs.publish_signed
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = arm64 ]; then app=desktop/dist/mac-arm64/NOSSOM.app; else app=desktop/dist/mac/NOSSOM.app; fi
          spctl --assess --type execute --verbose=2 "$app"
      - name: Verify Windows signature
        if: matrix.platform == 'win' && inputs.publish_signed
        shell: pwsh
        run: |
          Get-ChildItem desktop/dist/*.exe | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -ne 'Valid') { throw 'Windows installer signature is not valid.' }
          }
      - name: Report packaging error
        if: failure()
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('fs');
          const filename = process.env.RUNNER_TEMP + '/nossom-build.log';
          if (fs.existsSync(filename)) {
            const message = fs.readFileSync(filename, 'utf8').slice(-10000)
              .replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
            process.stdout.write('::error title=Packaging log::' + message + '\n');
          }
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: NOSSOM-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            products/nossom/desktop/dist/*.dmg
            products/nossom/desktop/dist/*.exe
            products/nossom/desktop/dist/*.zip
            products/nossom/desktop/dist/*.blockmap
            products/nossom/desktop/dist/*.yml
          if-no-files-found: error
          retention-days: 14

  publish-preview:
    needs: package
    if: always() && inputs.publish_preview && !inputs.publish_signed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: NOSSOM-*
          merge-multiple: true
          path: products/nossom/installers
      - name: Publish test installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./desktop/package.json').version")
          tag="nossom-v${version}"
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Instaladores NOSSOM para teste. O Mac usa assinatura local de integridade (ad-hoc), sem certificado de desenvolvedor ou notarização Apple.
          Não foram homologados em computadores físicos Mac/Windows.
          Atualizações automáticas do instalador ainda não estão habilitadas nesta distribuição.
          O aplicativo acessa a NOSSOM online; os projetos ficam no perfil local do aplicativo.
          Baixe apenas o arquivo correspondente ao seu sistema e arquitetura.
          EOF
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --latest=false --title "NOSSOM Desktop ${version} · Prévia" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          shopt -s nullglob
          files=(installers/*.dmg installers/*.exe installers/*.zip installers/*.blockmap)
          if [ ${#files[@]} -eq 0 ]; then exit 1; fi
          for file in "${files[@]}"; do
            name=$(basename "$file")
            if ! gh release view "$tag" --json assets --jq '.assets[].name' | rg -Fqx -- "$name"; then
              gh release upload "$tag" "$file"
            fi
          done

  publish-signed:
    needs: package
    if: inputs.publish_signed && needs.package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: NOSSOM-*
          merge-multiple: true
          path: products/nossom/installers
      - name: Prepare complete signed release
        run: node desktop/update-manifests.cjs installers
      - name: Publish installers before activating update channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./desktop/package.json').version")
          tag="nossom-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This version already exists. Increment the desktop version; do not overwrite installers.'
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          NOSSOM Desktop com download automático de atualizações.
          A instalação aguarda o término de gravações e tratamentos antes de reiniciar.
          Mac: assinatura Developer ID e notarização Apple verificadas.
          Windows: assinatura Authenticode verificada.
          Quem usa uma prévia 0.1.x precisa instalar esta versão uma vez para habilitar o canal automático.
          EOF
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "NOSSOM Desktop ${version}" --notes-file "$RUNNER_TEMP/release-notes.md"
          shopt -s nullglob
          installers=(installers/*.dmg installers/*.exe installers/*.zip installers/*.blockmap)
          manifests=(installers/latest.yml installers/latest-mac.yml)
          gh release upload "$tag" "${installers[@]}" "${manifests[@]}"
          gh release edit "$tag" --draft=false --latest=false
          # Canal de atualização (release fixa nossom-atualizacoes): instaladores primeiro, manifestos por último.
          channel="nossom-atualizacoes"
          if ! gh release view "$channel" >/dev/null 2>&1; then
            gh release create "$channel" --target "$GITHUB_SHA" --latest=false --title "NOSSOM Desktop · canal de atualização" --notes "Arquivos usados pela atualização automática do NOSSOM Desktop. Para baixar, use as releases nossom-v*."
          fi
          gh release upload "$channel" --clobber "${installers[@]}"
          gh release upload "$channel" --clobber "${manifests[@]}"
