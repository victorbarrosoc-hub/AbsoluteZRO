# Testes do Synquei (products/synquei): motor de sincronia, ponta a ponta, /baixar, login Absolute ZRO, organizador
# e ponte do DaVinci. Roda só quando a pasta do Synquei (ou este arquivo) muda.
name: Synquei · testes

on:
  push:
    branches: [main]
    paths:
      - 'products/synquei/**'
      - '.github/workflows/synquei-testes.yml'
  pull_request:
    paths:
      - 'products/synquei/**'
      - '.github/workflows/synquei-testes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synquei-testes-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: products/synquei

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/synquei/package-lock.json
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libxml2-utils unzip luajit
      - run: npm ci
      - run: npm test
