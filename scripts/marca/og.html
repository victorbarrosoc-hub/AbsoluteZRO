<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../node_modules/@fontsource-variable/inter-tight/index.css" />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        background: #000;
        overflow: hidden;
      }
      body {
        font-family: 'Inter Tight Variable', 'Inter', sans-serif;
        color: #fff;
        position: relative;
        -webkit-font-smoothing: antialiased;
      }
      .bg {
        position: absolute;
        inset: 0;
        background: url(og-fundo.jpg) center/cover;
      }
      .fade {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(0, 0, 0, 0.72) 0%, rgba(0, 0, 0, 0.45) 42%, rgba(0, 0, 0, 0) 62%);
      }
      .wrap {
        position: absolute;
        left: 72px;
        top: 64px;
        right: 72px;
        bottom: 56px;
        display: flex;
        flex-direction: column;
      }
      .mark {
        height: 40px;
        width: auto;
        align-self: flex-start;
        opacity: 0.96;
      }
      h1 {
        margin-top: 50px;
        font-size: 84px;
        line-height: 1;
        font-weight: 200;
        letter-spacing: -1.5px;
        color: rgba(240, 244, 250, 0.94);
      }
      h1 span {
        display: block;
        font-weight: 800;
        letter-spacing: -2.6px;
        background: linear-gradient(92deg, #e9eef7 0%, #a9c3ec 45%, #6aa2ff 100%);
        -webkit-background-clip: text;
        color: transparent;
      }
      p {
        margin-top: 22px;
        font-family: 'Inter Tight Variable', 'Inter', sans-serif;
        font-size: 25px;
        line-height: 1.35;
        color: rgba(232, 238, 248, 0.78);
        font-weight: 400;
        max-width: 680px;
      }
      .apps {
        margin-top: auto;
        display: flex;
        gap: 12px;
      }
      .app {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px 10px 10px;
        border-radius: 16px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.035));
        border: 1px solid rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(14px);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      .app img {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        display: block;
      }
      .app b {
        font-family: 'Inter', sans-serif;
        font-size: 17px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.92);
        letter-spacing: -0.1px;
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="fade"></div>
    <div class="wrap">
      <img class="mark" src="../../apps/hub-web/public/brand/absolute-zro-wordmark-alpha.webp" alt="" />
      <h1>O futuro começa<span>do zero.</span></h1>
      <p>Uma conta para todas as ferramentas, do job à entrega.</p>
      <div class="apps">
        <div class="app"><img src="../../apps/hub-web/public/products/carro-do-freela.png" /><b>Carro do Freela</b></div>
        <div class="app"><img src="../../apps/hub-web/public/products/tpeasy.svg" /><b>TPeasy</b></div>
        <div class="app"><img src="../../apps/hub-web/public/products/sobedesce.svg" /><b>SOBEDESCE</b></div>
        <div class="app"><img src="../../apps/hub-web/public/products/synquei.svg" /><b>Synquei</b></div>
        <div class="app"><img src="../../apps/hub-web/public/products/nossom.svg" /><b>NOSSOM</b></div>
      </div>
    </div>
  </body>
</html>
