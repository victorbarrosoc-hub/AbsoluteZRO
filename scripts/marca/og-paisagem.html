<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../node_modules/@fontsource-variable/figtree/index.css" />
    <!-- OG 1200×630 (27/10/2026, pedido do titular): a mesma paisagem do topo da página inicial (o símbolo em metal
         sobre a rocha), a frase da marca à esquerda sobre um véu escuro e o nome embaixo. Capture com o Playwright
         para apps/hub-web/app/opengraph-image.jpg (o twitter-image.jpg é a mesma imagem). -->
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b0b0c;
      }
      body {
        position: relative;
        font-family: 'Figtree Variable', sans-serif;
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }
      .foto {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 62% 46%;
      }
      .veu {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgb(8 8 10 / 0.86) 0%, rgb(8 8 10 / 0.62) 38%, rgb(8 8 10 / 0.08) 66%, transparent),
          linear-gradient(0deg, rgb(8 8 10 / 0.55), transparent 35%);
      }
      .texto {
        position: absolute;
        left: 72px;
        top: 0;
        bottom: 0;
        width: 560px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 22px;
      }
      h1 {
        font-size: 76px;
        font-weight: 300;
        line-height: 1;
        letter-spacing: -0.03em;
      }
      h1 b {
        display: block;
        font-weight: 800;
      }
      p {
        color: rgb(255 255 255 / 0.72);
        font-size: 24px;
        line-height: 1.35;
        max-width: 440px;
      }
      .nome {
        position: absolute;
        left: 72px;
        bottom: 48px;
        height: 22px;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <img class="foto" src="../../apps/hub-web/public/brand/home-paisagem.webp" alt="" />
    <div class="veu"></div>
    <div class="texto">
      <h1>O futuro começa <b>do zero.</b></h1>
      <p>Ferramentas para a produção audiovisual, numa conta só.</p>
    </div>
    <img class="nome" src="../../apps/hub-web/public/brand/absolute-zro-branco.svg" alt="" />
  </body>
</html>
