<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../node_modules/@fontsource-variable/figtree/index.css" />
    <!-- OG 1200×630 (26/10/2026, escolha do titular): o símbolo grande à esquerda, frase e apps à direita, fundo
         branco e chapado (sem brilho nem relevo). Ícones dos apps sem placa nem borda: cada um com a própria forma. -->
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #fff;
      }
      body {
        position: relative;
        font-family: 'Figtree Variable', sans-serif;
        color: #1d1d1f;
        -webkit-font-smoothing: antialiased;
      }
      .simbolo {
        position: absolute;
        left: 70px;
        top: 50%;
        width: 400px;
        height: 400px;
        transform: translateY(-50%);
      }
      .wrap {
        position: absolute;
        left: 560px;
        top: 0;
        bottom: 0;
        width: 600px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 24px;
      }
      .mark {
        height: 22px;
        align-self: flex-start;
      }
      h1 {
        font-size: 72px;
        font-weight: 300;
        line-height: 1.02;
        letter-spacing: -0.025em;
      }
      h1 b {
        display: block;
        font-weight: 800;
      }
      p {
        color: #6e6e73;
        font-size: 25px;
      }
      .icons {
        display: flex;
        gap: 14px;
      }
      .icons img {
        width: 56px;
        height: 56px;
        border-radius: 23%;
      }
    </style>
  </head>
  <body>
    <img class="simbolo" src="../../apps/hub-web/public/brand/absolute-zro-simbolo-grafite.svg" alt="" />
    <div class="wrap">
      <img class="mark" src="../../apps/hub-web/public/brand/absolute-zro-grafite.svg" alt="" />
      <h1>O futuro começa<b>do zero.</b></h1>
      <p>Uma conta. Todas as ferramentas.</p>
      <div class="icons">
        <img src="../../apps/hub-web/public/products/sobedesce.svg" /><img src="../../apps/hub-web/public/products/synquei.svg" /><img
          src="../../apps/hub-web/public/products/nossom.svg"
        /><img src="../../apps/hub-web/public/products/tpeasy.svg" /><img src="../../apps/hub-web/public/products/carro-do-freela.png" /><img
          src="../../apps/hub-web/public/products/finishing.svg"
        />
      </div>
    </div>
  </body>
</html>
